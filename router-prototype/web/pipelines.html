<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipelines - duck-code router</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { color-scheme: dark; --bg: #111418; --panel: #151a21; --deep: #0d1014; --line: #262b33; --line2: #333c48;
    --text: #d8dee6; --muted: #8fa3bd; --dim: #6c7a8c; --accent: #2d6cdf; --bad: #ff8095; --warn: #ffd166; --ok: #7fd18b; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  a { color: #8ab4ff; }
  :focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
  header.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header.top h1 { font-size: 1rem; margin: 0; display: flex; align-items: center; gap: 8px; }
  header.top img { width: 20px; height: 20px; }
  .layout { display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); gap: 0; min-height: calc(100vh - 50px); }
  #listCol { border-right: 1px solid var(--line); padding: 12px; min-width: 0; }
  #detailCol { padding: 12px 16px; min-width: 0; }
  button { padding: 6px 12px; background: var(--accent); color: #fff; border: 0; border-radius: 4px; cursor: pointer; font-size: .85rem; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: #262b33; }
  button.danger { background: #b3354a; }
  h2 { font-size: .8rem; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #detail h2 { font-size: 1.05rem; margin: 0; color: var(--text); text-transform: none; letter-spacing: 0; }
  h3 { font-size: .85rem; margin: 16px 0 6px; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li.none { color: var(--dim); font-size: .8rem; padding: 4px 8px; }
  button.item { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; background: transparent; color: var(--text);
    padding: 6px 8px; border: 1px solid transparent; border-radius: 4px; }
  button.item:hover { background: #182335; }
  button.item.on { background: #182335; border-color: var(--accent); }
  .iname { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .warn { color: var(--warn); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .layer { font-size: .68rem; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
  .layer.managed { color: var(--ok); border-color: #2f5a39; }
  .layer.user { color: #c9a4ff; border-color: #4e3a6e; }
  .catprob { margin-top: 14px; font-size: .75rem; color: var(--warn); overflow-wrap: anywhere; }
  .catprob p { margin: 4px 0; }
  .dhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .problems { border: 1px solid #6e5a1f; background: #2a2412; border-radius: 6px; padding: 8px 12px; margin: 8px 0; font-size: .8rem; overflow-wrap: anywhere; }
  .problems p { margin: 4px 0 0; }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  #delHost { display: inline-flex; align-items: center; gap: 8px; }
  .why { font-size: .78rem; color: var(--muted); }
  .status { min-height: 1.2em; font-size: .8rem; color: var(--ok); margin: 0 0 6px; }
  .status.bad { color: var(--bad); }
  .nameForm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; font-size: .85rem; }
  .nameForm input { padding: 6px; background: var(--deep); color: inherit; border: 1px solid #2c333d; border-radius: 4px; min-width: 0; flex: 1 1 160px; }
  .nameForm .err { flex-basis: 100%; margin: 0; color: var(--bad); font-size: .78rem; }
  .editor, .source { width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; line-height: 1.45;
    background: var(--deep); color: var(--text); border: 1px solid var(--line2); border-radius: 6px; padding: 10px; margin: 0; }
  .editor { resize: vertical; white-space: pre; overflow: auto; min-height: 260px; }
  .source { white-space: pre; overflow: auto; max-height: 60vh; }
  ul.errors { margin: 8px 0 0; padding: 0 0 0 18px; color: var(--bad); font-size: .8rem; overflow-wrap: anywhere; }
  ul.errors:empty { display: none; }
  .hint { color: var(--dim); font-size: .85rem; }
  .zoomBar { display: flex; gap: 6px; margin-bottom: 6px; }
  .zoomBar button { white-space: nowrap; min-width: 2.2em; }
  .graphBox:focus-visible { outline: 2px solid #6aa9ff; outline-offset: 1px; }
  .graphBox { max-width: 100%; max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--deep); padding: 4px; }
  .pipeGraph { display: block; font-family: system-ui, sans-serif; }
  .pipeGraph .pgNode rect { fill: var(--panel); stroke: var(--line2); stroke-width: 1.5; }
  .pipeGraph .pgNode.start rect { stroke: var(--accent); }
  .pipeGraph .pgNodeId { fill: var(--text); font-size: 13px; font-weight: 600; }
  .pipeGraph .pgNodeType { fill: var(--muted); font-size: 11px; }
  .pipeGraph .pgEdge { fill: none; stroke: var(--muted); stroke-width: 1.4; }
  .pipeGraph .pgEdge.dashed { stroke-dasharray: 6 4; stroke: var(--dim); }
  .pipeGraph .pgEdge.checks { stroke-width: 1; stroke: #5f9ea0; }
  .pipeGraph .pgEdge.after { stroke-width: 2.6; stroke: #d9a441; }
  .pipeGraph .pgEdge.accepted-work { stroke-dasharray: 2 4; stroke: var(--muted); }
  .pipeGraph .pgEdge.required { stroke-dasharray: 2 4; stroke-width: 2.6; stroke: #e07a5f; }
  .pipeGraph .pgNode.script rect { stroke: #5f9ea0; stroke-dasharray: 5 3; }
  .pipeGraph .pgNodeCfg { fill: var(--dim); font-size: 11px; }
  .pipeGraph .pgNodeBadge { fill: #e07a5f; font-size: 11px; font-weight: 600; }
  .pipeGraph .node-badge-wait { fill: #d9a441; font-size: 11px; font-weight: 600; }
  .pipeGraph .pgNode.wait rect { stroke: #d9a441; }
  .pipeGraph .pgEdge.edge-handoff { stroke: var(--accent); stroke-width: 2; stroke-dasharray: none; }
  .pipeGraph .pgEdge.edge-rework { stroke: #e07a5f; stroke-dasharray: 6 4; }
  .pipeGraph .pgEdge.edge-arrive { stroke: #35c46a; stroke-dasharray: none; }
  .pgLegend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 6px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: .75rem; color: var(--text); }
  .pgLegend legend { padding: 0 4px; color: var(--muted); }
  .pgKind { display: inline-flex; align-items: center; gap: 4px; }
  .pgSwatch { display: inline-block; width: 26px; border-top: 1.4px solid var(--muted); }
  .pgKind.checks .pgSwatch { border-top: 1px solid #5f9ea0; }
  .pgKind.after .pgSwatch { border-top: 3px solid #d9a441; }
  .pgKind.accepted-work .pgSwatch { border-top: 2px dotted var(--muted); }
  .pgKind.required .pgSwatch { border-top: 3px dotted #e07a5f; }
  .pipeGraph .pgArrowHead { fill: var(--muted); }
  .pipeGraph .pgEdgeLabel { fill: var(--text); font-size: 11px; paint-order: stroke; stroke: var(--deep); stroke-width: 4px; stroke-linejoin: round; }
  .edgesText { font-size: .72rem; color: var(--muted); }
  .edgesText ul { margin: 6px 0 0; padding-left: 18px; }
  .tabs { display: flex; gap: 4px; margin: 10px 0 8px; border-bottom: 1px solid var(--line); }
  .tab { background: transparent; color: var(--muted); border: 1px solid transparent; border-bottom: 0; border-radius: 4px 4px 0 0; padding: 6px 16px; }
  .tab[aria-selected="true"] { background: var(--panel); color: var(--text); border-color: var(--line2); box-shadow: inset 0 -2px 0 var(--accent); }
  .visualHost { display: flex; gap: 10px; align-items: flex-start; }
  .cvPalette { flex: 0 0 160px; min-width: 0; }
  .cvCanvas { flex: 1 1 0; min-width: 0; }
  .cvInspector { flex: 0 0 220px; min-width: 0; }
  .cvPalette h2 { margin-top: 0; }
  .cvPalette h3 { margin: 10px 0 4px; color: var(--muted); font-weight: 600; }
  .cvPalList { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .cvPalItem { width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line2); cursor: grab; overflow-wrap: anywhere; }
  .cvPalItem:hover { border-color: var(--accent); }
  .cvInspector:empty, .cvPalette[hidden] { display: none; }
  .cvBox { max-width: 100%; height: 60vh; min-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--deep); }
  .cvLegend { display: flex; flex-wrap: wrap; gap: 4px 14px; list-style: none; margin: 0 0 6px; padding: 4px 8px; font-size: .75rem;
    border: 1px solid var(--line); border-radius: 6px; }
  .cvKey { display: inline-flex; align-items: center; gap: 4px; }
  .cvKey.handoff .pgSwatch { border-top: 2px solid var(--accent); }
  .cvKey.rework .pgSwatch { border-top: 2px dashed #e07a5f; }
  .cvKey.arrive .pgSwatch { border-top: 2px solid #35c46a; }
  .cvSvg .cvNode { cursor: grab; touch-action: none; }
  .cvSvg .pgNode.sel rect { stroke: var(--warn); stroke-width: 2.5; }
  .cvSvg .pgNode.start rect { stroke: var(--accent); stroke-width: 3; }
  .cvSvg .pgNode.start.sel rect { stroke: var(--warn); }
  .cvSvg .cvAnchor { fill: var(--deep); stroke: var(--muted); stroke-width: 1.5; cursor: crosshair; transition: r .1s; }
  .cvSvg .cvAnchor:hover, .cvSvg .cvAnchor:focus-visible { r: 9; stroke: var(--warn); }
  .cvSvg .cvAnchor.drop { fill: var(--accent); r: 9; }
  .cvSvg .cvTemp { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; pointer-events: none; }
  .cvSvg .pgNode.target rect { stroke: var(--accent); stroke-width: 3; stroke-dasharray: 5 3; }
  .cvDialog { background: var(--panel); color: inherit; border: 1px solid var(--muted); border-radius: 8px; max-width: min(480px, 92vw); }
  .cvDialog::backdrop { background: rgba(0, 0, 0, .55); }
  .cvChoices { display: grid; gap: 6px; margin: 10px 0; }
  .cvChoice { display: grid; grid-template-columns: auto auto 1fr; gap: 6px; align-items: baseline; }
  .cvDlgError { color: var(--warn); margin: 0; }
  .cvDlgBar { display: flex; gap: 8px; justify-content: flex-end; }
  .cvSvg .cvHit { fill: none; stroke: transparent; stroke-width: 12px; pointer-events: stroke; cursor: pointer; }
  .cvSvg .cvArrow.sel .pgEdge { stroke: var(--warn); stroke-width: 3; }
  .cvSvg .cvArrow:hover .pgEdge { stroke-width: 3; }
  .cvSvg .pgEdgeLabel { pointer-events: none; }
  .cvSvg g:focus { outline: none; }
  .cvSvg g:focus-visible > rect, .cvSvg .cvArrow:focus-visible .pgEdge { stroke: var(--warn); stroke-width: 3; }
  @media (max-width: 800px) {
    .visualHost { flex-direction: column; align-items: stretch; }
    .cvPalette, .cvInspector { flex-basis: auto; }
    .cvPalList { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .layout { grid-template-columns: minmax(0, 1fr); }
    #listCol { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header class="top">
  <h1><img src="/favicon.svg" alt="">duck-code</h1>
  <a href="/" id="backLink">Back to the dashboard</a>
</header>
<div class="layout">
  <nav id="listCol" aria-label="Pipelines, node types and interactions">
    <button type="button" id="newBtn">New pipeline</button>
    <div id="newHost"></div>
    <div id="listHost"></div>
  </nav>
  <main id="detailCol">
    <p id="status" class="status" role="status"></p>
    <div id="detail"></div>
  </main>
</div>
<script src="/pipeline-ui.js"></script>
<script src="/pipeline-canvas.js"></script>
<script src="/pipelines-page.js"></script>
</body>
</html>
