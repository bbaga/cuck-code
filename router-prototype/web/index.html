<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cuck-code router</title>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; display: flex; min-height: 100vh;
    font-family: system-ui, sans-serif; background: #111418; color: #d8dee6; }
  .tabBtn { padding: 6px 14px; background: transparent; color: #8fa3bd; border: 0;
    border-radius: 4px; cursor: pointer; font-size: .8rem; }
  .tabBtn.active { background: #182335; color: #d8dee6; outline: 1px solid #2d6cdf; }
  .procPane { flex: 1; overflow-y: auto; padding: 12px 16px; font-size: .78rem; }
  .evPane { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .evCase { margin-bottom: 18px; }
  .evCase .uc { font-size: .82rem; margin-bottom: 6px; color: #d8dee6; }
  .evCase .meta { color: #6c7a8c; font-size: .7rem; margin-bottom: 4px; }
  .evCase video { width: 100%; max-width: 640px; border: 1px solid #262b33;
    border-radius: 6px; background: #000; }
  .procPane .pHead { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .procPane .pHead .sub { color: #6c7a8c; font-size: .72rem; }
  .pEmpty { color: #4a5563; font-size: .72rem; }
  #sidebar { width: 280px; padding: 24px; border-right: 1px solid #262b33;
    background: #161a20; flex-shrink: 0; }
  #sidebar h1 { font-size: 1.1rem; margin: 0 0 16px; }
  #sidebar button { width: 100%; }
  button { padding: 8px 14px; background: #2d6cdf; color: #fff; border: 0;
    border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #lines { flex: 1; padding: 24px; }
  .card { border: 1px solid #262b33; border-radius: 8px; background: #161a20;
    display: flex; flex-direction: column; width: 100%;
    max-height: calc(100vh - 110px); }
  #empty { color: #6c7a8c; font-size: .9rem; }
  #linelist { margin-top: 20px; border-top: 1px solid #262b33; padding-top: 12px; }
  .lineentry { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 6px; cursor: pointer; font-size: .85rem; }
  .lineentry:hover { background: #0d1014; }
  .lineentry.selected { background: #182335; outline: 1px solid #2d6cdf; }
  .lineentry .dot { margin-left: 0; }
  .lineentry .lname { flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .lcount { color: #6c7a8c; font-size: .75rem; flex-shrink: 0; }
  .head { display: flex; align-items: center; gap: 8px; padding: 12px 16px;
    border-bottom: 1px solid #262b33; font-weight: 600; }
  .deleteBtn { margin-left: 8px; padding: 3px 10px; font-size: .7rem;
    background: #4d1420; color: #ff8095; }
  .deleteBtn.armed { background: #ff8095; color: #2a0810; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-left: auto; flex-shrink: 0; }
  .dot.idle { background: #35c46a; }
  .dot.running { background: #3d8bff; animation: pulse 1.2s infinite; }
  .dot.completed { background: #35c46a; }
  .dot.failed { background: #ff5f6e; }
  .dot.stopped { background: #6c7a8c; }
  .dot.standby { background: #6c7a8c; }
  @keyframes pulse { 50% { opacity: .3; } }
  .banner { margin: 8px 16px 0; padding: 8px; border-radius: 4px;
    background: #4d1420; color: #ff8095; font-size: .85rem; white-space: pre-wrap; }
  .planDetails { border-bottom: 1px solid #262b33; }
  .planDetails summary { cursor: pointer; padding: 6px 16px; color: #6c7a8c;
    font-size: .75rem; user-select: none; }
  .planDetails[open] summary { color: #8fa3bd; }
  .planDetails .planBody { padding: 4px 16px 12px; }
  .plan { padding: 12px 16px; border-bottom: 1px solid #262b33;
    max-height: 260px; overflow-y: auto; font-size: .85rem; }
  .plan .waiting { color: #6c7a8c; font-size: .8rem; }
  .planBody h1, .planBody h2, .planBody h3 { font-size: .95rem; margin: 8px 0 4px; }
  .planBody p { margin: 4px 0; }
  .planBody ul { margin: 4px 0; padding-left: 20px; }
  .planBody pre { background: #0d1014; padding: 6px; border-radius: 4px;
    overflow-x: auto; font-size: .75rem; }
  .planBody code { background: #0d1014; padding: 0 4px; border-radius: 3px; }
  .planBody pre code { padding: 0; }
  .planBody .mermaid { background: #0d1014; padding: 6px; border-radius: 4px;
    margin: 6px 0; text-align: center; }
  .plan .controls { display: flex; gap: 8px; margin-top: 10px; align-items: flex-start; }
  .plan .controls button { padding: 6px 12px; font-size: .8rem; }
  .badge { padding: 3px 10px; border-radius: 10px; background: #14331f;
    color: #58d68d; font-size: .75rem; }
  .graph { position: relative; border-bottom: 1px solid #262b33;
    overflow: auto; max-height: 300px; min-height: 120px; }
  .invRow { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: .78rem; }
  .invRow .kind { color: #6c7a8c; width: 34px; flex-shrink: 0; }
  .invRow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .invRow .by { color: #6c7a8c; flex-shrink: 0; font-size: .7rem; }
  .invRow button { padding: 2px 8px; font-size: .7rem; }
  .keepBtn { background: #14331f; color: #58d68d; }
  .keepBtn.kept { background: #58d68d; color: #10261a; }
  .killBtn { background: #4d1420; color: #ff8095; }
  .graph svg { display: block; }
  .graph svg .edge { stroke: #333c48; stroke-width: 1.5; }
  .gnode { position: absolute; display: flex; align-items: center; gap: 8px;
    padding: 0 10px; height: 36px; border: 1px solid #333c48; border-radius: 8px;
    background: #10141a; font-size: .8rem; cursor: pointer; user-select: none; }
  .gnode .dot { margin-left: 0; }
  .gnode.sel { outline: 2px solid #2d6cdf; }
  .gnode.w-running { border-color: #3d8bff; }
  .gnode.w-completed { border-color: #35c46a; }
  .gnode.w-failed { border-color: #ff5f6e; }
  .gnode.w-stopped { border-color: #6c7a8c; }
  .gnode.w-validator { border-color: #a78bfa; }
  .gnode.w-validator .dot { background: #a78bfa; }
  .persona-chip { flex-shrink: 0; margin-right: 6px; padding: 1px 6px;
    border-radius: 8px; font-size: .65rem; text-transform: uppercase;
    letter-spacing: .4px; }
  .persona-chip.p-backend { background: #3a3320; color: #e5c07b; }
  .persona-chip.p-frontend { background: #1a2e2a; color: #5fd6b4; }
  .gnode .stopBtn { padding: 2px 8px; font-size: .7rem; margin-left: auto;
    background: #4d1420; color: #ff8095; }
  .transcript { flex: 1; overflow-y: auto; padding: 12px 16px;
    font-family: ui-monospace, monospace; font-size: .8rem; white-space: pre-wrap;
    word-break: break-word; }
  .transcript > div { margin-bottom: 10px; }
  .user { color: #8fa3bd; }
  .assistant { color: #d8dee6; }
  .transcript details { border-left: 2px solid #333c48; padding-left: 8px; }
  .transcript summary { cursor: pointer; color: #6c7a8c; font-size: .75rem; }
  .transcript pre { margin: 6px 0 0; color: #8b98a8; }
  .liveLabel { color: #6c7a8c; font-size: .75rem; font-family: system-ui, sans-serif; }
  .row { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #262b33; }
  .row input { flex: 1; padding: 8px; background: #0d1014; color: inherit;
    border: 1px solid #2c333d; border-radius: 4px; }
</style>
</head>
<body>
<aside id="sidebar">
  <h1>cuck-code</h1>
  <button id="create">+ Create new line</button>
  <div id="linelist"></div>
</aside>
<main id="lines">
  <div id="empty">Select or create a production line.</div>
</main>
<script>
window.addEventListener("DOMContentLoaded", () => {
  const cards = new Map();
  const linesEl = document.getElementById("lines");
  const listEl = document.getElementById("linelist");
  let selectedLine = null;
  const SVGNS = "http://www.w3.org/2000/svg";

  mermaid.initialize({ startOnLoad: false, theme: "dark" });

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  marked.use({ renderer: { code(codeOrToken, infostring) {
    const text = typeof codeOrToken === "object" ? codeOrToken.text : codeOrToken;
    const lang = ((typeof codeOrToken === "object" ? codeOrToken.lang : infostring) || "").trim();
    if (lang === "mermaid") return '<div class="mermaid">' + text + "</div>";
    return "<pre><code>" + escapeHtml(text) + "</code></pre>";
  } } });

  function textOf(entry) {
    const c = entry.content;
    if (typeof c === "string") return c;
    if (Array.isArray(c)) return c.filter(p => p && p.type === "text").map(p => p.text).join("");
    if (typeof entry.text === "string") return entry.text;
    return "";
  }

  function entryEl(entry) {
    const div = document.createElement("div");
    const details = (label, body) => {
      const d = document.createElement("details");
      const s = document.createElement("summary");
      s.textContent = label;
      const pre = document.createElement("pre");
      pre.textContent = body;
      d.append(s, pre);
      div.appendChild(d);
    };
    if (entry && entry.type === "message" && entry.role === "user") {
      div.className = "user";
      div.textContent = "> " + textOf(entry);
    } else if (entry && entry.type === "message" && entry.role === "assistant") {
      div.className = "assistant";
      div.textContent = textOf(entry);
    } else if (entry && entry.type === "reasoning") {
      details("thinking", textOf(entry));
    } else {
      details((entry && entry.type) || "unknown", JSON.stringify(entry, null, 2));
    }
    return div;
  }

  async function renderPlan(st, content) {
    st.planBody.innerHTML = marked.parse(content);
    for (const node of st.planBody.querySelectorAll("div.mermaid")) {
      try { await mermaid.run({ nodes: [node] }); }
      catch {
        const pre = document.createElement("pre");
        pre.textContent = node.textContent;
        node.replaceWith(pre);
      }
    }
  }

  function updateControls(st) {
    st.approveBtn.hidden = st.approved;
    st.badge.hidden = !st.approved;
    if (st.approved && st.planBody.parentNode !== st.planDetails) {
      st.planDetails.appendChild(st.planBody);
      st.planDetails.hidden = false;
      st.plan.hidden = true;
    } else if (!st.approved && st.planBody.parentNode === st.planDetails) {
      st.plan.insertBefore(st.planBody, st.planControls);
      st.planDetails.hidden = true;
      st.plan.hidden = false;
    }
    if (st.started && st.planContent && !st.approved) {
      st.input.placeholder = "Plan proposed - type feedback here";
    } else if (st.started) {
      st.input.placeholder = "Send a prompt";
    }
  }

  function workerNode(st, w, x, y, width, withEdges) {
    const validator = (w.role || "implementor") === "validator";
    const n = document.createElement("div");
    n.className = "gnode worker w-" + w.status + (validator ? " w-validator" : "")
      + (st.selected === w.id ? " sel" : "");
    n.style.left = x + "px";
    n.style.top = y + "px";
    n.style.width = width + "px";
    const nm = document.createElement("span");
    nm.textContent = w.name;
    nm.style.overflow = "hidden";
    nm.style.textOverflow = "ellipsis";
    nm.style.whiteSpace = "nowrap";
    const tag = document.createElement("span");
    tag.className = "persona-chip p-" + (w.persona || "backend");
    tag.textContent = validator ? "val" : (w.persona || "backend");
    n.append(tag, nm);
    const d = document.createElement("span");
    d.className = "dot " + w.status;
    n.append(d);
    if (w.status === "running") {
      const stop = document.createElement("button");
      stop.className = "stopBtn";
      stop.textContent = "Stop";
      stop.addEventListener("click", async (e) => {
        e.stopPropagation();
        await fetch("/api/protocol/workers/" + w.id + "/stop", { method: "POST" });
      });
      n.appendChild(stop);
    }
    n.addEventListener("click", () => selectNode(st, w.id));
    return n;
  }

  function renderGraph(st) {
    const impls = [...st.workers.values()].filter((w) => (w.role || "implementor") !== "validator");
    const vals = [...st.workers.values()].filter((w) => (w.role || "implementor") === "validator");
    const rows = Math.max(impls.length, vals.length, 1);
    const h = Math.max(140, 14 + (rows - 1) * 46 + 36 + 14);
    const graph = st.graph;
    graph.innerHTML = "";
    const W = graph.clientWidth || 440;
    const plannerW = 92, plannerX = 12;
    const nodeW = 190;
    const implX = plannerX + plannerW + 46;
    const valX = implX + nodeW + 46;
    const innerW = Math.max(W, valX + nodeW + 12);
    const inner = document.createElement("div");
    inner.style.position = "relative";
    inner.style.height = h + "px";
    inner.style.width = innerW + "px";
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("width", innerW);
    svg.setAttribute("height", h);
    inner.appendChild(svg);
    graph.appendChild(inner);
    const plannerY = Math.round(h / 2 - 18);
    const implY = (i) => 14 + i * 46;

    const pn = document.createElement("div");
    pn.className = "gnode planner" + (st.selected === null ? " sel" : "");
    pn.style.left = plannerX + "px";
    pn.style.top = plannerY + "px";
    pn.style.width = plannerW + "px";
    const pnLabel = document.createElement("span");
    pnLabel.textContent = "planner";
    const pd = document.createElement("span");
    pd.className = "dot " + (st.plannerStatus === "running" ? "running" : "idle");
    pn.append(pnLabel, pd);
    pn.addEventListener("click", () => selectNode(st, null));
    inner.appendChild(pn);

    const edge = (x1, y1, x2, y2) => {
      const line = document.createElementNS(SVGNS, "line");
      line.setAttribute("x1", x1);
      line.setAttribute("y1", y1);
      line.setAttribute("x2", x2);
      line.setAttribute("y2", y2);
      line.setAttribute("class", "edge");
      svg.appendChild(line);
    };

    impls.forEach((w, i) => {
      edge(plannerX + plannerW, plannerY + 18, implX, implY(i) + 18);
      inner.appendChild(workerNode(st, w, implX, implY(i), nodeW));
    });

    vals.forEach((v, j) => {
      const implIdx = impls.findIndex((w) => w.id === v.validates);
      const fromY = implIdx !== -1 ? implY(implIdx) : plannerY;
      edge(implX + nodeW, fromY + 18, valX, implY(j) + 18);
      inner.appendChild(workerNode(st, v, valX, implY(j), nodeW));
    });
  }

  function selectNode(st, id) {
    st.selected = id;
    const w = id !== null ? st.workers.get(id) : null;
    const isValidator = w && (w.role || "implementor") === "validator";
    st.tabEvBtn.hidden = !isValidator;
    renderGraph(st);
    renderTranscript(st);
  }

  function appendEntry(st, el) {
    st.transcript.appendChild(el);
    st.transcript.scrollTop = st.transcript.scrollHeight;
  }

  function renderTranscript(st) {
    st.transcript.innerHTML = "";
    if (st.selected === null) {
      for (const e of st.plannerTranscript) appendEntry(st, entryEl(e));
    } else {
      const w = st.workers.get(st.selected);
      const label = document.createElement("div");
      label.className = "liveLabel";
      label.textContent = "worker '" + (w ? w.name : st.selected)
        + "' - live view (since page load)";
      st.transcript.appendChild(label);
      for (const e of st.workerTranscripts.get(st.selected) || []) {
        appendEntry(st, entryEl(e));
      }
    }
    st.transcript.scrollTop = st.transcript.scrollHeight;
  }

  function addCard(line) {
    const card = document.createElement("div");
    card.className = "card";
    const head = document.createElement("div");
    head.className = "head";
    const name = document.createElement("span");
    name.textContent = line.name;
    const dot = document.createElement("span");
    dot.className = "dot";
    const tabLineBtn = document.createElement("button");
    tabLineBtn.className = "tabBtn active";
    tabLineBtn.textContent = "Line";
    tabLineBtn.style.marginLeft = "auto";
    const tabProcBtn = document.createElement("button");
    tabProcBtn.className = "tabBtn";
    tabProcBtn.textContent = "Processes";
    const tabEvBtn = document.createElement("button");
    tabEvBtn.className = "tabBtn";
    tabEvBtn.textContent = "Evidence";
    tabEvBtn.hidden = true;
    const delBtn = document.createElement("button");
    delBtn.className = "deleteBtn";
    delBtn.textContent = "Delete";
    let disarmTimer = null;
    delBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!delBtn.classList.contains("armed")) {
        delBtn.classList.add("armed");
        delBtn.textContent = "Sure?";
        disarmTimer = setTimeout(() => {
          delBtn.classList.remove("armed");
          delBtn.textContent = "Delete";
        }, 4000);
        return;
      }
      clearTimeout(disarmTimer);
      await fetch("/api/lines/" + line.id, { method: "DELETE" });
      removeCard(line.id);
    });
    head.append(name, dot, tabLineBtn, tabProcBtn, tabEvBtn, delBtn);
    const planDetails = document.createElement("details");
    planDetails.className = "planDetails";
    planDetails.hidden = true;
    const planSummary = document.createElement("summary");
    planSummary.textContent = "Plan";
    planDetails.appendChild(planSummary);
    const banner = document.createElement("div");
    banner.className = "banner";
    banner.hidden = true;

    const plan = document.createElement("div");
    plan.className = "plan";
    const waiting = document.createElement("div");
    waiting.className = "waiting";
    waiting.textContent = "waiting for plan.md ...";
    const planBody = document.createElement("div");
    planBody.className = "planBody";
    const controls = document.createElement("div");
    controls.className = "controls";
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = "approved";
    badge.hidden = true;
    const approveBtn = document.createElement("button");
    approveBtn.textContent = "Approve";
    controls.append(badge, approveBtn);
    plan.append(waiting, planBody, controls);

    const graph = document.createElement("div");
    graph.className = "graph";

    const transcript = document.createElement("div");
    transcript.className = "transcript";
    const row = document.createElement("div");
    row.className = "row";
    const input = document.createElement("input");
    input.placeholder = "Send a prompt";
    const send = document.createElement("button");
    send.textContent = "Send";
    row.append(input, send);
    const procPane = document.createElement("div");
    procPane.className = "procPane";
    procPane.hidden = true;
    const evPane = document.createElement("div");
    evPane.className = "evPane";
    evPane.hidden = true;
    card.append(head, planDetails, banner, plan, graph, transcript, row, procPane, evPane);
    linesEl.appendChild(card);

    const st = { id: line.id, dot, banner, transcript, input, send,
      waiting, planBody, graph, approveBtn, badge, planDetails, planControls: controls,
      tab: "line", tabLineBtn, tabProcBtn, tabEvBtn, plan, row, procPane, evPane,
      plannerStatus: line.status, started: line.started === true,
      planContent: undefined, approved: false,
      workers: new Map(), workerTranscripts: new Map(),
      plannerTranscript: [], selected: null };

    tabLineBtn.addEventListener("click", () => setLineTab(st, "line"));
    tabProcBtn.addEventListener("click", () => setLineTab(st, "processes"));
    tabEvBtn.addEventListener("click", () => setLineTab(st, "evidence"));

    const setStatus = (status) => {
      st.plannerStatus = status;
      dot.className = "dot " + (status === "running" ? "running"
        : status === "standby" ? "standby" : "idle");
      input.disabled = send.disabled = status === "running";
      if (st.started) {
        input.placeholder = (st.planContent && !st.approved)
          ? "Plan proposed - type feedback here" : "Send a prompt";
      } else {
        input.placeholder = "Type the initial prompt and press Enter";
      }
      renderGraph(st);
      updateListEntry(st);
    };
    const showError = (message) => {
      banner.textContent = message;
      banner.hidden = false;
    };

    approveBtn.addEventListener("click", async () => {
      await fetch("/api/lines/" + st.id + "/approve", { method: "POST" });
      st.approved = true;
      updateControls(st);
    });

    const es = new EventSource("/api/lines/" + st.id + "/events");
    st.es = es;
    es.addEventListener("state", (e) => {
      const state = JSON.parse(e.data);
      st.plannerTranscript = state.transcript;
      st.approved = !!state.planApproved;
      if (state.started === true) st.started = true;
      updateControls(st);
      st.workers = new Map(state.workers.map((w) => [w.id, w]));
      for (const w of state.workers) {
        if (!st.workerTranscripts.has(w.id)) st.workerTranscripts.set(w.id, []);
      }
      if (st.selected !== null && !st.workers.has(st.selected)) st.selected = null;
      setStatus(state.status);
      renderTranscript(st);
    });
    es.addEventListener("status", (e) => setStatus(JSON.parse(e.data).status));
    es.addEventListener("entry", (e) => {
      const entry = JSON.parse(e.data);
      st.plannerTranscript.push(entry);
      if (st.selected === null) appendEntry(st, entryEl(entry));
    });
    es.addEventListener("worker_entry", (e) => {
      const { workerId, entry } = JSON.parse(e.data);
      if (!st.workerTranscripts.has(workerId)) {
        st.workerTranscripts.set(workerId, []);
        if (!st.workers.has(workerId)) {
          st.workers.set(workerId, { id: workerId, name: workerId, status: "running", branch: "",
            role: "implementor", kind: "standard" });
        }
      }
      st.workerTranscripts.get(workerId).push(entry);
      if (st.selected === workerId) appendEntry(st, entryEl(entry));
    });
    es.addEventListener("worker_spawned", (e) => {
      const { worker } = JSON.parse(e.data);
      st.workers.set(worker.id, worker);
      if (!st.workerTranscripts.has(worker.id)) st.workerTranscripts.set(worker.id, []);
      renderGraph(st);
      updateListEntry(st);
    });
    es.addEventListener("worker_status", (e) => {
      const { workerId, status } = JSON.parse(e.data);
      const w = st.workers.get(workerId);
      if (w) w.status = status;
      renderGraph(st);
      updateListEntry(st);
    });
    es.addEventListener("error", (e) => { if (e.data) showError(JSON.parse(e.data).message); });

    const post = async () => {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      if (!st.started) {
        st.started = true;
        input.placeholder = "Send a prompt";
      }
      await fetch("/api/lines/" + st.id + "/prompts", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
    };
    send.addEventListener("click", post);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") post(); });

    setStatus(line.status);
    renderGraph(st);
    updateControls(st);

    const entryDot = document.createElement("span");
    entryDot.className = "dot";
    const entryName = document.createElement("span");
    entryName.className = "lname";
    entryName.textContent = line.name;
    const entryCount = document.createElement("span");
    entryCount.className = "lcount";
    const entry = document.createElement("div");
    entry.className = "lineentry";
    entry.append(entryDot, entryName, entryCount);
    entry.addEventListener("click", () => selectLine(st.id));
    listEl.appendChild(entry);
    st.card = card;
    st.entry = entry;
    st.entryDot = entryDot;
    st.entryCount = entryCount;
    card.style.display = "none";
    cards.set(line.id, st);
    updateListEntry(st);
    if (selectedLine === null) selectLine(line.id);
  }

  function removeCard(id) {
    const st = cards.get(id);
    if (st) {
      if (st.es) st.es.close();
      st.card.remove();
      st.entry.remove();
      cards.delete(id);
    }
    if (selectedLine === id) {
      const next = cards.keys().next();
      selectLine(next.done ? null : next.value);
    }
  }

  function updateListEntry(st) {
    if (!st.entry) return;
    const anyRunning = st.plannerStatus === "running"
      || [...st.workers.values()].some((w) => w.status === "running");
    st.entryDot.className = "dot " + (anyRunning ? "running"
      : st.plannerStatus === "standby" ? "standby" : "idle");
    st.entryCount.textContent = st.workers.size ? st.workers.size + "w" : "";
  }

  function setLineTab(st, tab) {
    st.tab = tab;
    st.tabLineBtn.classList.toggle("active", tab === "line");
    st.tabProcBtn.classList.toggle("active", tab === "processes");
    st.tabEvBtn.classList.toggle("active", tab === "evidence");
    for (const el of [st.plan, st.planDetails, st.graph, st.transcript, st.row]) {
      el.hidden = tab !== "line";
    }
    st.procPane.hidden = tab !== "processes";
    st.evPane.hidden = tab !== "evidence";
    if (tab === "processes") pollInventory();
    if (tab === "evidence") pollEvidence();
    if (tab === "line") {
      renderGraph(st);
      st.transcript.scrollTop = st.transcript.scrollHeight;
    }
  }

  function selectLine(id) {
    selectedLine = id;
    for (const st of cards.values()) {
      const show = st.id === id;
      st.card.style.display = show ? "flex" : "none";
      st.entry.classList.toggle("selected", show);
    }
    document.getElementById("empty").hidden = id !== null;
    const st = cards.get(id);
    if (!st) return;
    if (st.tab === "processes") pollInventory();
    else {
      renderGraph(st);
      st.transcript.scrollTop = st.transcript.scrollHeight;
    }
  }

  function inventoryRow(lineId, item) {
    const row = document.createElement("div");
    row.className = "invRow";
    const kind = document.createElement("span");
    kind.className = "kind";
    kind.textContent = item.kind === "container" ? "ctr" : "proc";
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = item.name + (item.status === "running" ? "" : "  (" + item.status + ")");
    nm.style.color = item.status === "running" ? "#d8dee6" : "#4a5563";
    const by = document.createElement("span");
    by.className = "by";
    by.textContent = "by: " + (item.by === "planner" ? "planner"
      : String(item.by).slice(0, 8));
    const keep = document.createElement("button");
    keep.className = "keepBtn" + (item.keep ? " kept" : "");
    keep.textContent = item.keep ? "kept" : "keep";
    keep.title = "Keep: survives stage end and line deletion until killed";
    keep.addEventListener("click", async () => {
      await fetch("/api/lines/" + lineId + "/inventory/" + item.id + "/keep", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ keep: !item.keep }),
      });
      pollInventory();
    });
    const kill = document.createElement("button");
    kill.className = "killBtn";
    kill.textContent = "Kill";
    kill.disabled = item.status !== "running";
    kill.addEventListener("click", async () => {
      await fetch("/api/lines/" + lineId + "/inventory/" + item.id + "/kill", { method: "POST" });
      pollInventory();
    });
    row.append(kind, nm, by, keep, kill);
    return row;
  }

  function renderLineProcesses(st, items) {
    const pane = st.procPane;
    pane.innerHTML = "";
    const head = document.createElement("div");
    head.className = "pHead";
    const sub = document.createElement("span");
    sub.className = "sub";
    const running = items.filter((i) => i.status === "running").length;
    sub.textContent = items.length + " items, " + running + " running";
    const killAll = document.createElement("button");
    killAll.className = "killBtn";
    killAll.style.marginLeft = "auto";
    killAll.textContent = "Kill all";
    killAll.addEventListener("click", async () => {
      await fetch("/api/lines/" + st.id + "/inventory/kill-all", { method: "POST" });
      pollInventory();
    });
    head.append(sub, killAll);
    pane.appendChild(head);
    if (!items.length) {
      const e = document.createElement("div");
      e.className = "pEmpty";
      e.textContent = "No processes or containers started.";
      pane.appendChild(e);
      return;
    }
    for (const item of items) pane.appendChild(inventoryRow(st.id, item));
  }

  function renderEvidence(st, items) {
    const pane = st.evPane;
    pane.innerHTML = "";
    if (!items.length) {
      const e = document.createElement("div");
      e.className = "pEmpty";
      e.textContent = "No evidence registered for this validator yet.";
      pane.appendChild(e);
      return;
    }
    for (const item of items) {
      const box = document.createElement("div");
      box.className = "evCase";
      const uc = document.createElement("div");
      uc.className = "uc";
      uc.textContent = item.useCase;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = new Date(item.at).toLocaleString() + " - " + item.name;
      const video = document.createElement("video");
      video.controls = true;
      video.preload = "metadata";
      video.src = item.video;
      box.append(uc, meta, video);
      pane.appendChild(box);
    }
  }

  async function pollEvidence() {
    const st = cards.get(selectedLine);
    if (!st || st.tab !== "evidence") return;
    try {
      const res = await fetch("/api/lines/" + st.id + "/evidence");
      if (!res.ok) return;
      const { items } = await res.json();
      renderEvidence(st, items);
    } catch {}
  }

  async function pollInventory() {
    const st = cards.get(selectedLine);
    if (!st || st.tab !== "processes") return;
    const gen = (st.invGen = (st.invGen || 0) + 1);
    try {
      const res = await fetch("/api/lines/" + st.id + "/inventory");
      if (!res.ok) return;
      const { items } = await res.json();
      if (gen !== st.invGen || st.tab !== "processes" || selectedLine !== st.id) return;
      renderLineProcesses(st, items);
    } catch {}
  }

  async function pollPlans() {
    for (const st of cards.values()) {
      try {
        const res = await fetch("/api/lines/" + st.id + "/plan");
        const data = await res.json();
        if (data.approved !== st.approved) {
          st.approved = data.approved;
          updateControls(st);
        }
        const content = data.exists ? data.content : null;
        if (content !== st.planContent) {
          st.planContent = content;
          st.waiting.hidden = content !== null;
          updateControls(st);
          st.planBody.innerHTML = "";
          if (content !== null) renderPlan(st, content);
        }
      } catch {}
    }
  }

  async function refresh() {
    try {
      const res = await fetch("/api/lines");
      const { lines } = await res.json();
      const present = new Set(lines.map((l) => l.id));
      for (const id of [...cards.keys()]) {
        if (!present.has(id)) removeCard(id);
      }
      for (const line of lines) {
        if (!cards.has(line.id)) { addCard(line); continue; }
        const st = cards.get(line.id);
        if (line.started && !st.started) {
          st.started = true;
          st.input.placeholder = "Send a prompt";
        }
        if (st.entryCount) st.entryCount.textContent = line.workers ? line.workers + "w" : "";
      }
    } catch {}
  }

  document.getElementById("create").addEventListener("click", async () => {
    const res = await fetch("/api/lines", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: "{}",
    });
    const { id } = await res.json().catch(() => ({}));
    await refresh();
    if (id) selectLine(id);
  });

  refresh();
  setInterval(refresh, 3000);
  setInterval(pollPlans, 3000);
  setInterval(pollInventory, 3000);
  setInterval(pollEvidence, 3000);
});
</script>
</body>
</html>
