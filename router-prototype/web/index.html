  .nodeRow .authHint { grid-column: 1 / -1; }
  .saveRow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; margin-top: 10px; }
  #createPanel button:disabled { opacity: .5; cursor: not-allowed; }
  .presetBar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto auto;
    gap: 6px; align-items: center; margin: 4px 0 8px; }
  .presetBar button, .pipeBtns button { white-space: nowrap; }
  .pipeBtns { display: flex; gap: 8px; margin-top: 10px; }
  button.secondary { background: #262b33; }
  .createErr.ok { background: #143d2a; color: #7ee2a8; }
  @media (max-width: 640px) { .presetBar { grid-template-columns: 1fr 1fr; } }
  .wcfg { font-size: .62rem; color: #6c7a8c; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #registry { flex: 1; padding: 24px; min-width: 0; }
  .regSummary, .regConn { font-size: .8rem; color: #8fa3bd; }
  .regControls, .regPager, .regTabs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .regTableWrap { overflow-x: auto; }
  #registry table { border-collapse: collapse; font-size: .78rem; width: 100%; }
  #registry th, #registry td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #262b33; }
  #registry th { color: #8fa3bd; }
  .regDetails { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 4px 0; font-size: .78rem; }
  .regDetails dt { color: #8fa3bd; }
  .regDetails dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .regEvents { font-size: .78rem; }
  .regBadge { background: #4d3a14; color: #ffc46b; border-radius: 3px; padding: 0 4px; }
  .regError { padding: 6px; border-radius: 4px; background: #4d1420; color: #ff8095; font-size: .8rem; }
  #registry input, #registry select { padding: 6px; background: #0d1014; color: inherit; border: 1px solid #2c333d; border-radius: 4px; }
  @media (max-width: 640px) {
    body { flex-direction: column; }
    #sidebar { width: auto; box-sizing: border-box; border-right: 0; border-bottom: 1px solid #262b33; }
    #registry { padding: 12px; }
    .phaseRow, .nodeRow { grid-template-columns: 1fr 1fr; }
    .phaseRow .phaseName { grid-column: 1 / -1; }
    .authHint { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<aside id="sidebar">
  <h1><img src="/favicon.svg" alt="">cuck-code</h1>
  <button id="create">+ Create new line</button>
  <button id="registryBtn" aria-pressed="false">Registry</button>
  <button id="pipelinesBtn" type="button">Pipelines</button>
  <div id="linelist"></div>
</aside>
<main id="lines">
  <div id="empty">Select or create a production line.</div>
</main>
<section id="registry" hidden aria-label="Registry"></section>
<script src="pipeline-ui.js"></script>
<script src="worker-scope.js"></script>
<script src="markdown-renderer.js"></script>
<script src="registry-ui-extra.js"></script>
<script src="registry-ui.js"></script>
<script src="registry-line.js"></script>
<script>
window.addEventListener("DOMContentLoaded", () => {
  const { nodeRowsFromResolved, defaultOptionLabels, layoutGraph, nodeRowsFromGraphView, nodeSummaryText, edgeTextLines, buildNodeSettingsPayload, buildCreateBody, pickerPipelines, buildGraphChangeBody, graphSwitchView, remapComplete,
    pipelineOptionLabel, pipelineErrorsText, EFFORT_LEVELS, parseContextSize, formatTokens, filterInstalled, authBadge, harnessOptionLabel, pluginProblemsSummary, harnessReloadOutcome, previewForIntegration,
    previewSelectionKey, previewSelectionExists, isPassingIntegration, mapPreviewPayload, fetchLinePreview, sanitizePreviewCommand,
    VIBE_HARNESS_ID, authModeOptions, modelOptionsForPhase, harnessHasProviders, providerDetailUrl, providerFromModel, authStatusText,
    authModeSelectState, piDetailApply, createRequestTracker, fetchPiDetail,
    clearHarnessState, clearProviderState, shouldHideValidator,
    shouldShowIntegrationValidator, buildGraphLanes, scriptSummary,
    selectEvidenceAttempt, clampEvidenceStep, renderEvidenceFromState,
    evidencePollIsCurrent, promptKeyAction, acceptStateStamp, queueRowLabel, createDraftOwner, clampSize, stepSize, chatMaxHeight, readStoredSize, writeStoredSize,
    formatScopePanelData, nodeWidth, columnWidth, NODE_FONT, NODE_CONFIG_FONT, attentionIndicator, markerState, lineMarkerState } = window.pipelineUI;
  const cards = new Map();
  const linesEl = document.getElementById("lines");
  const listEl = document.getElementById("linelist");
  let selectedLine = null;
  const SVGNS = "http://www.w3.org/2000/svg";
  const graphTextMeasure = (() => {
    try {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      return (text, font = NODE_FONT) => { ctx.font = font; return ctx.measureText(String(text)).width; };
    } catch (_) { return (text) => String(text).length * 8; }
  })();

  mermaid.initialize({ startOnLoad: false, theme: "dark" });

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  marked.use({ renderer: { code(codeOrToken, infostring) {
    const text = typeof codeOrToken === "object" ? codeOrToken.text : codeOrToken;
    const lang = ((typeof codeOrToken === "object" ? codeOrToken.lang : infostring) || "").trim();
    if (lang === "mermaid") return '<div class="mermaid">' + text + "</div>";
    return "<pre><code>" + escapeHtml(text) + "</code></pre>";
  } } });

  function textOf(entry) {
    const c = entry.content;
    if (typeof c === "string") return c;
    if (Array.isArray(c)) return c.filter(p => p && p.type === "text").map(p => p.text).join("");
    if (typeof entry.text === "string") return entry.text;
    return "";
  }

  function entryEl(entry) {
    const div = document.createElement("div");
    const stamp = () => {
      if (typeof entry.at !== "number") return;
      const s = document.createElement("span");
      s.className = "ts";
      s.textContent = new Date(entry.at).toLocaleTimeString([], { hour12: false });
      div.appendChild(s);
    };
    const details = (label, body, cls) => {
      const d = document.createElement("details");
      if (cls) d.className = cls;
      const s = document.createElement("summary");
      s.textContent = label;
      const pre = document.createElement("pre");
      pre.textContent = body;
      d.append(s, pre);
      div.appendChild(d);
    };
    if (entry && entry.type === "message" && entry.role === "user" && entry.origin === "router") {
      stamp();
      const text = textOf(entry);
      const first = text.split("\n", 1)[0];
      details("Router message: " + (first.length > 100 ? first.slice(0, 100) + "…" : first), text, "routerMessage");
    } else if (entry && entry.type === "message" && entry.role === "user") {
      div.className = "user";
      stamp();
      div.appendChild(document.createTextNode("> " + textOf(entry)));
    } else if (entry && entry.type === "message" && entry.role === "assistant") {
      div.className = "assistant";
      stamp();
      const md = window.markdownRenderer;
      if (md && typeof md.renderMarkdown === "function") div.appendChild(md.renderMarkdown(document, textOf(entry)));
      else div.appendChild(document.createTextNode(textOf(entry)));
    } else if (entry && entry.type === "message" && entry.role === "system") {
      div.className = "compacted";
      stamp();
      div.appendChild(document.createTextNode(textOf(entry)));
    } else if (entry && entry.type === "reasoning") {
      stamp();
      details("thinking", textOf(entry));
    } else {
      stamp();
      details((entry && entry.type) || "unknown", JSON.stringify(entry, null, 2));
    }
    return div;
  }

  async function renderPlan(st, content) {
    st.planBody.innerHTML = marked.parse(content);
    for (const node of st.planBody.querySelectorAll("div.mermaid")) {
      try { await mermaid.run({ nodes: [node] }); }
      catch {
        const pre = document.createElement("pre");
        pre.textContent = node.textContent;
        node.replaceWith(pre);
      }
    }
  }

  function updateControls(st) {
    st.approveBtn.hidden = st.approved;
    st.badge.hidden = !st.approved;
    if (st.approved && st.planBody.parentNode !== st.planDetails) {
      st.planDetails.appendChild(st.planBody);
      st.planDetails.hidden = st.tab !== "line";
      st.plan.hidden = true;
    } else if (!st.approved && st.planBody.parentNode === st.planDetails) {
      st.plan.insertBefore(st.planBody, st.planControls);
      st.planDetails.hidden = true;
      st.plan.hidden = st.tab !== "line";
    }
    if (st.started && st.planContent && !st.approved) {
      st.input.placeholder = "Plan proposed - type feedback here";
    } else if (st.started) {
      st.input.placeholder = "Send a prompt";
    }
  }

  function workerNode(st, w, x, y, width, withEdges) {
    const validator = (w.role || "implementor") === "validator";
    const n = document.createElement("div");
    n.className = "gnode worker w-" + w.status + (validator ? " w-validator" : "")
      + (w.verdict === "fail" ? " w-issue" : "")
      + (st.selected === w.id ? " sel" : "");
    n.style.left = x + "px";
    n.style.top = y + "px";
    n.style.width = width + "px";
    const script = w.runner === "script";
    if (script) n.classList.add("w-script");
    const nm = document.createElement("span");
    nm.textContent = script ? "\u2699 " + w.name : w.name;
    nm.className = "nodeName";
    const tag = document.createElement("span");
    tag.className = "persona-chip p-" + (w.persona || "backend");
    tag.textContent = validator ? "val" : (w.persona || "backend");
    if (script) {
      const summary = document.createElement("span");
      summary.className = "scriptSummary";
      summary.textContent = scriptSummary(w);
      n.append(nm, summary);
    } else n.append(tag, nm);
    const cfg = script ? "" : [w.harness, w.model, w.effort].filter(Boolean).join(" · ");
    if (cfg) {
      const cfgEl = document.createElement("span");
      cfgEl.className = "wcfg";
      cfgEl.textContent = cfg;
      cfgEl.title = cfg;
      n.appendChild(cfgEl);
    }
    const d = document.createElement("span");
    const marker = markerState(w);
    d.className = "dot " + marker.className;
    d.setAttribute("aria-label", marker.label);
    n.append(d);
    if (w.status === "running") {
      const stop = document.createElement("button");
      stop.className = "stopBtn";
      stop.textContent = "Stop";
      stop.addEventListener("click", async (e) => {
        e.stopPropagation();
        await fetch("/api/protocol/workers/" + w.id + "/stop", { method: "POST" });
      });
      n.appendChild(stop);
    }
    if (w.lastError) n.title = w.lastError;
    n.addEventListener("click", () => selectNode(st, w.id));
    return n;
  }

  const RESIZE_STEP = 16;

  function createResizeHandle(label) {
    const h = document.createElement("div");
    h.className = "resizeHandle";
    h.setAttribute("role", "separator");
    h.setAttribute("aria-orientation", "horizontal");
    h.setAttribute("aria-label", label);
    h.tabIndex = 0;
    return h;
  }

  function bindResizeHandle(handle, { getSize, apply, limits, reset }) {
    let drag = null;
    const end = () => {
      if (!drag) return;
      drag = null;
      handle.classList.remove("dragging");
      document.body.classList.remove("resizing");
    };
    handle.addEventListener("pointerdown", (e) => {
      if (e.button) return;
      e.preventDefault();
      drag = { y: e.clientY, size: getSize() };
      handle.setPointerCapture(e.pointerId);
      handle.classList.add("dragging");
      document.body.classList.add("resizing");
    });
    handle.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const { min, max } = limits();
      apply(clampSize(drag.size + e.clientY - drag.y, min, max));
    });
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
    handle.addEventListener("dblclick", reset);
    handle.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
      e.preventDefault();
      const { min, max } = limits();
      apply(stepSize(getSize(), e.key === "ArrowDown" ? RESIZE_STEP : -RESIZE_STEP, min, max));
    });
  }

  function setupLayoutResize({ lineId, card, graph, graphDetails, graphHandle, transcriptWrap, chatHandle }) {
    const store = (() => { try { return window.localStorage; } catch { return null; } })();
    const openKey = "graph-open:" + lineId;
    const graphKey = "graph-height:" + lineId;
    const chatKey = "chat-height:" + lineId;
    const graphLimits = () => ({ min: 80, max: Math.round(window.innerHeight * 0.8) });
    const chatLimits = () => ({ min: 120, max: chatMaxHeight(window.innerHeight) });
    const setGraph = (h) => {
      graph.classList.toggle("userSized", h !== null);
      graph.style.height = h === null ? "" : h + "px";
      graph.style.maxHeight = h === null ? "" : "none";
    };
    const setChat = (h) => {
      card.classList.toggle("chatSized", h !== null);
      transcriptWrap.style.height = h === null ? "" : h + "px";
    };
    let storedOpen = null;
    try { storedOpen = store && store.getItem(openKey); } catch {}
    graphDetails.open = storedOpen !== "0";
    graphDetails.addEventListener("toggle", () => {
      writeStoredSize(store, openKey, graphDetails.open ? null : 0);
      if (graphDetails.open) {
        const st = cards.get(lineId);
        if (st) renderGraph(st);
      }
    });
    const g = readStoredSize(store, graphKey, graphLimits().min, graphLimits().max);
    if (g !== null) setGraph(g);
    const c = readStoredSize(store, chatKey, chatLimits().min, chatLimits().max);
    if (c !== null) setChat(c);
    const area = (el, set, key) => ({
      getSize: () => el.getBoundingClientRect().height,
      apply: (h) => { set(h); writeStoredSize(store, key, h); },
      reset: () => { set(null); writeStoredSize(store, key, null); },
    });
    bindResizeHandle(graphHandle, { ...area(graph, setGraph, graphKey), limits: graphLimits });
    bindResizeHandle(chatHandle, { ...area(transcriptWrap, setChat, chatKey), limits: chatLimits });
  }

  function renderGraph(st) {
    const graph = st.graph;
    const top = graph.scrollTop, left = graph.scrollLeft;
    try {
      const sig = graphSignature(st);
      if (graph.children && graph.children.length && st.graphSig === sig) return;
      st.graphSig = null;
      renderGraphContents(st);
      st.graphSig = sig;
    } finally { graph.scrollTop = top; graph.scrollLeft = left; }
  }

  // Everything renderGraphContents draws or reads; equal signature means an identical graph.
  function graphSignature(st) {
    const fields = ["id", "name", "role", "kind", "status", "state", "verdict", "validates", "persona", "harness",
      "model", "effort", "attention", "needsAttention", "humanIntervention", "error", "hasError", "lastError", "merged",
      "node", "runner", "afterChecks", "checkResults"];
    const workers = [...st.workers.values()];
    return JSON.stringify([
      workers.map((w) => fields.map((f) => w[f])),
      workers.map((w) => !!mapPreviewPayload(st.previewPayload, w)),
      st.plannerStatus, st.plannerAttention, st.plannerHumanIntervention, st.plannerError,
      st.pipeGraph && st.pipeGraph.columns, st.selected, !!st.hideFailedValidators, st.graph.clientWidth, st.tab,
      !!(st.previewPanel && st.previewPanel.hidden),
    ]);
  }

  function graphTextMeasurer() {
    const ctx = typeof document.createElement === "function"
      ? document.createElement("canvas").getContext?.("2d") : null;
    if (!ctx) return (text) => text.length * 8;
    return (text, font) => { ctx.font = font; return ctx.measureText(text).width; };
  }

  function renderGraphContents(st) {
    const layout = pipelineUI.buildGraphLanes([...st.workers.values()], !!st.hideFailedValidators, st.pipeGraph);
    const entries = [...layout.placed, ...layout.unplaced];
    const rows = Math.max(layout.totalRows, 1);
    const h = Math.max(140, 14 + (rows - 1) * 46 + 36 + 14);
    const graph = st.graph;
    graph.innerHTML = "";
    const selectedPreviewWorker = st.selected && st.selected.startsWith("preview:")
      ? st.workers.get(st.selected.slice("preview:".length)) : null;
    if (selectedPreviewWorker && st.previewPanel.hidden) {
      const currentPreview = mapPreviewPayload(st.previewPayload, selectedPreviewWorker);
      if (currentPreview) renderPreviewPanel(st, selectedPreviewWorker, currentPreview);
    }
    const W = graph.clientWidth || 440;
    const plannerW = 92, plannerX = 12;
    const measure = graphTextMeasurer();
    const widthOf = (w) => nodeWidth(w, measure);
    // One x position per column that has a worker; the unplaced section (column null) comes last.
    const columnKeys = layout.unplaced.length ? [...layout.columns, null] : layout.columns;
    const columnX = new Map(), columnW = new Map();
    let nextX = plannerX + plannerW + 46;
    for (const key of columnKeys) {
      const width = columnWidth(entries.filter((e) => e.column === key).map((e) => widthOf(e.worker)));
      columnX.set(key, nextX); columnW.set(key, width);
      nextX += width + 46;
    }
    const innerW = Math.max(W, nextX - 46 + 12 + (entries.some((e) => mapPreviewPayload(st.previewPayload, e.worker)) ? 46 + 110 : 0));
    const inner = document.createElement("div");
    inner.style.position = "relative";
    inner.style.height = h + "px";
    inner.style.width = innerW + "px";
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("width", innerW);
    svg.setAttribute("height", h);
    inner.appendChild(svg);
    graph.appendChild(inner);
    const plannerY = Math.round(h / 2 - 18);
    const place = new Map(entries.map((e) => [e.worker.id,
      { x: columnX.get(e.column), y: 14 + e.row * 46, w: columnW.get(e.column) }]));

    const pn = document.createElement("div");
    pn.className = "gnode planner" + (st.selected === null ? " sel" : "");
    pn.style.left = plannerX + "px";
    pn.style.top = plannerY + "px";
    pn.style.width = plannerW + "px";
    const pnLabel = document.createElement("span");
    pnLabel.textContent = "planner";
    const pd = document.createElement("span");
    const plannerState = { status: st.plannerStatus, attention: st.plannerAttention,
      humanIntervention: st.plannerHumanIntervention, error: st.plannerError };
    const plannerMarker = markerState(plannerState);
    pd.className = "dot " + plannerMarker.className;
    pd.setAttribute("aria-label", plannerMarker.label);
    pn.append(pnLabel, pd);
    pn.addEventListener("click", () => selectNode(st, null));
    inner.appendChild(pn);

    const edge = (x1, y1, x2, y2) => {
      const path = document.createElementNS(SVGNS, "path");
      const mid = x1 + 20;
      path.setAttribute("d", `M ${x1} ${y1} H ${mid} V ${y2} H ${x2}`);
      path.setAttribute("class", "edge");
      path.setAttribute("fill", "none");
      svg.appendChild(path);
    };

    const gutterEdge = (from, to) => {
      const path = document.createElementNS(SVGNS, "path");
      const gutterX = from.x + from.w + 22;
      path.setAttribute("d", `M ${from.x + from.w} ${from.y + 18} H ${gutterX} V ${to.y + 18} H ${to.x}`);
      path.setAttribute("class", "edge");
      path.setAttribute("fill", "none");
      svg.appendChild(path);
    };
    // The incoming edges of an instance: from its on-screen "after" checks, else from
    // its source (validates), else from the planner.
    const sourcesOf = (w) => {
      const afters = (Array.isArray(w.afterChecks) ? w.afterChecks : []).map((id) => place.get(id)).filter(Boolean);
      if (afters.length) return afters;
      const source = place.get(w.validates);
      return source ? [source] : [];
    };

    entries.forEach((e) => {
      const w = e.worker, to = place.get(w.id);
      const sources = sourcesOf(w);
      if (!sources.length) edge(plannerX + plannerW, plannerY + 18, to.x, to.y + 18);
      for (const from of sources) {
        if (from.y === to.y) edge(from.x + from.w, from.y + 18, to.x, to.y + 18);
        else gutterEdge(from, to);
      }
      const node = workerNode(st, w, to.x, to.y, to.w);
      if (e.column === null) node.title = "This worker has no node in the pipeline graph.";
      inner.appendChild(node);
      const data = mapPreviewPayload(st.previewPayload, w);
      if (st.selected === previewSelectionKey(w.id) && data && st.previewPanel.hidden) renderPreviewPanel(st, w, data);
      if (data) {
        const px = to.x + to.w + 46, py = to.y;
        edge(to.x + to.w, py + 18, px, py + 18);
        const preview = document.createElement("button");
        preview.className = "gnode" + (st.selected === previewSelectionKey(w.id) ? " sel" : "");
        preview.textContent = "Preview";
        preview.style.left = px + "px"; preview.style.top = py + "px"; preview.style.width = "110px";
        preview.addEventListener("click", () => selectPreview(st, w, data));
        inner.appendChild(preview);
      }
    });
  }

  function selectPreview(st, worker, data) {
    st.selected = previewSelectionKey(worker.id);
    try { localStorage.setItem("preview-selection:" + st.id, st.selected); } catch {}
    renderPreviewPanel(st, worker, data);
  }

  function renderPreviewPanel(st, worker, data) {
    // A late preview result must not open the panel on another tab; return to
    // Line re-renders it from st.previewPayload.
    if (st.tab && st.tab !== "line") return;
    const panel = document.createElement("section");
    panel.setAttribute("aria-label", "Preview instructions");
    const title = document.createElement("h2"); title.textContent = "Preview instructions (read only)"; panel.appendChild(title);
    const add = (label, value) => { if (!value) return; const p = document.createElement("p"); p.textContent = label + ": " + value; panel.appendChild(p); };
    add("Revision", data.sourceRevision); add("Project directory", data.projectDirectory); add("Expected URL", data.expectedUrl);
    add("Prerequisites", Array.isArray(data.prerequisites) ? data.prerequisites.join("; ") : "");
    if (Array.isArray(data.limitations) && data.limitations.length) {
      const heading = document.createElement("h3"); heading.textContent = "Limitations"; panel.appendChild(heading);
      data.limitations.forEach((limitation) => { const item = document.createElement("p"); item.textContent = limitation; panel.appendChild(item); });
    }
    if (!data.expectedUrl) add("Confirm manually", "The expected URL is not known. Confirm the correct URL before verification.");
    if (!Array.isArray(data.environment) || data.environment.length === 0) add("Environment", "No environment requirements were provided. Confirm required environment values yourself. Do not paste secrets into commands.");
    add("Explanation", data.message || data.reason || "");
    if (data.stale === true) add("Data status", "Stale. Do not rely on these instructions.");
    if (data.availability === "unavailable") add("Data status", data.message || "Preview data is unavailable.");
    if (data.eligible !== true) add("Data status", "Not eligible for use. Preview instructions require a completed passing integration.");
    if (data.availability !== "available") add("Availability", data.reason || data.message || data.availability || "Unavailable");
    if (data.eligible !== true && data.steps.length === 0) add("Instructions", "No usable preview steps are available.");
    if (data.eligible === true) {
      const phaseNames = { prerequisites: "Prerequisites", revision: "Get revision", install: "Install", run: "Run", verify: "Verify", stop: "Stop" };
      let phase = null, number = 0;
      data.steps.forEach((rawStep) => {
        const step = typeof rawStep === "string" ? { text: rawStep } : (rawStep && typeof rawStep === "object" ? rawStep : {});
        const nextPhase = typeof step.phase === "string" ? step.phase.toLowerCase() : "";
        const group = phaseNames[nextPhase] || "Additional steps";
        if (group !== phase) { const heading = document.createElement("h3"); heading.textContent = group; panel.appendChild(heading); phase = group; }
        number++;
        const box = document.createElement("div"); box.className = "previewStep";
        const label = document.createElement("h4"); label.textContent = number + ". " + (step.description || step.title || "Instruction"); box.appendChild(label);
        const command = step.manual !== true && step.type !== "manual" && typeof step.command === "string"
          ? sanitizePreviewCommand(step.command) : "";
        const text = command || step.text || (typeof rawStep === "string" ? rawStep : "");
        if (text) { const details = document.createElement("p"); details.textContent = text; box.appendChild(details); }
        if (command) { const pre = document.createElement("pre"); pre.textContent = command; box.appendChild(pre);
          const copy = document.createElement("button"); copy.type = "button"; copy.textContent = "Copy command";
          copy.addEventListener("click", () => navigator.clipboard.writeText(command)); box.appendChild(copy); }
        if (step.expected) { const expected = document.createElement("p"); expected.textContent = "Expected outcome: " + step.expected; box.appendChild(expected); }
        else if (nextPhase === "verify") { const expected = document.createElement("p"); expected.textContent = "Expected outcome: Confirm the result manually; no expected result was provided."; box.appendChild(expected); }
        panel.appendChild(box);
      });
    }
    st.previewPanel.replaceChildren(panel); st.previewPanel.hidden = false; renderGraph(st);
  }

  function selectNode(st, id) {
    if (st.previewPanel) st.previewPanel.hidden = true;
    if (st.selected !== id) st.followTranscript = true;
    st.selected = id;
    if (st.historyLoader) st.historyLoader.remove(id);
    try { localStorage.removeItem("preview-selection:" + st.id); } catch {}
    const w = id !== null ? st.workers.get(id) : null;
    const isValidator = w && (w.role || "implementor") === "validator";
    if (st.tabEvBtn) st.tabEvBtn.hidden = !isValidator;
    renderGraph(st);
    renderTranscript(st);
    renderContextControls(st);
    if (st.scopeLoader) st.scopeLoader.retry(id);
    if (typeof renderScopePanel === "function") renderScopePanel(st);
  }

  function renderScopePanel(st) {
    if (!st || !st.scopeDetails || !st.scopeText) return;
    const worker = st.selected !== null && typeof st.selected === "string" && !st.selected.startsWith("preview:")
      ? st.workers && st.workers.get(st.selected) : null;
    const show = !!worker && (worker.role || "implementor") !== "planner" && (st.tab || "line") === "line";
    st.scopeDetails.hidden = !show;
    if (!show) return;
    const scope = st.scopeLoader ? st.scopeLoader.read(worker) : { state: "loaded", data: worker };
    const loading = scope.state === "loading";
    st.scopeDetails.setAttribute("aria-busy", String(loading));
    if (st.scopeStatus) {
      st.scopeStatus.hidden = scope.state === "loaded";
      st.scopeStatus.setAttribute("aria-busy", String(loading));
      st.scopeStatus.textContent = loading ? "Loading scope…"
        : "Unable to load scope. Select the worker again to retry.";
    }
    st.scopeText.textContent = scope.state === "loaded"
      ? formatScopePanelData({ ...worker, ...scope.data }) || "No scope data available." : "";
    if (worker.runner === "script" || st.checkCard) renderCheckCard(st, worker);
  }

  // The card of a script check worker: the run mode, the run root, the checked
  // commit and one table row per script. It sits in the scope panel.
  function renderCheckCard(st, worker) {
    if (!st.checkCard) {
      st.checkCard = document.createElement("div");
      st.checkCard.className = "checkCard";
      st.checkCard.setAttribute("aria-label", "Script check");
      st.scopeText.after(st.checkCard);
    }
    const card = st.checkCard;
    card.hidden = worker.runner !== "script";
    card.textContent = "";
    if (card.hidden) return;
    const spec = worker.scriptSpec || {};
    const checkout = spec.checkout || "worktree";
    const source = st.workers.get(worker.validates);
    const root = checkout === "clean" ? "clean checkout at " + (worker.checkedCommit || "unknown")
      : "worktree of " + (source ? source.name : worker.validates || "unknown") + ": " + (worker.worktreePath || "unknown");
    const list = document.createElement("dl");
    for (const [label, value] of [["Runner", "scripts"], ["Checkout", checkout], ["Run root", root],
      ["Checked commit", worker.checkedCommit || "unknown"]]) {
      const dt = document.createElement("dt"); dt.textContent = label;
      const dd = document.createElement("dd"); dd.textContent = value;
      list.append(dt, dd);
    }
    card.appendChild(list);
    const results = Array.isArray(worker.checkResults) ? worker.checkResults : [];
    if (!results.length) {
      const none = document.createElement("p");
      none.textContent = worker.status === "running" ? "No script has finished yet." : "No script results.";
      card.appendChild(none);
      return;
    }
    const table = document.createElement("table");
    const head = table.createTHead().insertRow();
    for (const name of ["#", "Name", "Status", "Exit", "Duration", "Log"]) {
      const th = document.createElement("th"); th.scope = "col"; th.textContent = name; head.appendChild(th);
    }
    const body = table.createTBody();
    results.forEach((r, position) => {
      const row = body.insertRow();
      const cells = [r.index, r.name, String(r.status || "").toUpperCase(),
        r.exitCode === null || r.exitCode === undefined ? (r.signal || "") : r.exitCode,
        typeof r.durationMs === "number" ? (r.durationMs / 1000).toFixed(1) + " s" : ""];
      cells.forEach((value, i) => {
        const td = row.insertCell(); td.textContent = value === undefined ? "" : value;
        if (i === 2) td.className = "st-" + r.status;
      });
      if (r.reason && (r.status === "fail" || r.status === "skipped")) {
        row.cells[2].textContent += ": " + r.reason;
      }
      const logCell = row.insertCell();
      if (r.logFile) {
        const link = document.createElement("a");
        link.textContent = "log";
        link.href = "/api/protocol/workers/" + encodeURIComponent(worker.id) + "/check-log?step=" + position;
        link.target = "_blank"; link.rel = "noopener";
        link.setAttribute("aria-label", "log of " + r.name);
        logCell.appendChild(link);
      }
    });
    card.appendChild(table);
  }

  // Context meter and Compact button for the selected session: the planner
  // or an implementor. Validators and preview nodes have no session to
  // compact.
  function renderContextControls(st) {
    if (!st.ctxMeter) return;
    const target = st.selected === null ? st.plannerCtx
      : (typeof st.selected === "string" && !st.selected.startsWith("preview:")
        ? st.workers.get(st.selected) : null);
    const ctx = target && target.context;
    st.ctxMeter.hidden = st.compactBtn.hidden = !ctx;
    if (!ctx) return;
    const limit = ctx.threshold ? " / " + formatTokens(ctx.threshold) : "";
    st.ctxMeter.textContent = (ctx.estimated ? "~" : "") + formatTokens(ctx.tokens) + limit + " ctx";
    st.ctxMeter.classList.toggle("near", !!ctx.threshold && ctx.tokens >= ctx.threshold * 0.8);
    st.ctxMeter.title = (ctx.estimated
      ? "Estimated from prompt and reply text; tool output is not counted. "
      : "Reported by the harness. ")
      + ctx.turns + " turn(s) on this session, " + ctx.compactions + " compaction(s)."
      + (ctx.threshold ? " Compacts automatically at " + formatTokens(ctx.threshold) + "." : "");
    const running = st.selected === null ? st.plannerStatus === "running" : target.status === "running";
    st.compactBtn.textContent = target.compacting ? "Compacting…" : "Compact";
    st.compactBtn.disabled = !!target.compacting || !target.hasSession || running;
    st.compactBtn.title = target.compacted && !target.hasSession
      ? "Compacted; the next run starts a fresh session with the summary."
      : "Summarize this session and continue in a fresh one.";
  }

  function applyStateWorkers(st, state, { updateListEntry, refreshPreview }) {
    st.workers = new Map((state.workers || []).map((w) => [w.id, w]));
    if (st.scopeLoader) st.scopeLoader.retain(new Set(st.workers.keys()));
    if (st.selected === null) {
      try {
        const savedPreview = localStorage.getItem("preview-selection:" + st.id);
        if (previewSelectionExists(state.workers || [], savedPreview)) st.selected = savedPreview;
      } catch {}
    }
    // A state snapshot is authoritative for each worker it contains.
    // Copy entries so later worker_entry events append without mutating state.
    for (const w of state.workers || []) {
      st.workerTranscripts.set(w.id, Array.isArray(w.transcript) ? w.transcript.slice() : []);
    }
    if (typeof st.selected === "string" && st.selected.startsWith("preview:")) {
      if (!previewSelectionExists(state.workers || [], st.selected)) st.selected = null;
      else {
        const selectedPreviewId = st.selected.slice("preview:".length);
        const selectedWorker = (state.workers || []).find((worker) => String(worker.id) === selectedPreviewId);
        const currentData = selectedWorker && mapPreviewPayload(st.previewPayload, selectedWorker);
        if (currentData) renderPreviewPanel(st, selectedWorker, currentData);
      }
    } else if (st.selected !== null && !st.workers.has(st.selected)) st.selected = null;
    // Render before the async preview so a slow or failed preview cannot leave the graph empty.
    renderGraph(st); updateListEntry(st);
    refreshPreview();
  }

  function syncTranscriptScroll(st) {
    // Hidden lines/tabs have no scroll geometry; retain their follow state.
    if (!st.transcript.clientHeight) return;
    if (st.followTranscript) st.transcript.scrollTop = st.transcript.scrollHeight;
    st.scrollBottomBtn.hidden = st.followTranscript;
  }

  function setupTranscriptScroll(st) {
    st.followTranscript = true;
    st.transcript.addEventListener("scroll", () => {
      if (!st.transcript.clientHeight) return;
      const { scrollHeight, scrollTop, clientHeight } = st.transcript;
      st.followTranscript = scrollHeight - scrollTop - clientHeight <= 4;
      st.scrollBottomBtn.hidden = st.followTranscript;
    });
    st.scrollBottomBtn.addEventListener("click", () => {
      st.followTranscript = true;
      syncTranscriptScroll(st);
    });
    // Keep following when the viewport or surrounding panels change size.
    st.transcriptResizeObserver = new ResizeObserver(() => syncTranscriptScroll(st));
    st.transcriptResizeObserver.observe(st.transcript);
  }

  function appendEntry(st, el) {
    st.transcript.appendChild(el);
    syncTranscriptScroll(st);
  }

  function renderTranscript(st) {
    const scrollTop = st.transcript.scrollTop;
    st.transcript.innerHTML = "";
    const live = st.selected === null ? st.plannerTranscript : st.workerTranscripts.get(st.selected) || [];
    const history = st.historyActive && st.historyLoader && !(typeof st.selected === "string" && st.selected.startsWith("preview:"))
      ? st.historyLoader.read({ id: st.selected }) : null;
    const entries = history && history.state === "loaded"
      ? window.workerScope.mergeHistoryEntries(history.data.entries, live) : live;
    if (history && (history.state !== "loaded" || entries.length === 0 || history.data.truncated)) {
      const status = document.createElement("div");
      status.className = "historyStatus scopeLoading";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-busy", String(history.state === "loading"));
      status.textContent = history.state === "loading" ? "Loading chat history…"
        : history.state === "error" ? "Unable to load chat history. Select the node again to retry."
        : history.data.truncated ? "Showing the latest 500 messages."
        : "No saved chat history is available for this node.";
      st.transcript.appendChild(status);
    }
    if (st.selected === null) {
      for (const e of entries) st.transcript.appendChild(entryEl(e));
    } else {
      const w = st.workers.get(st.selected);
      const label = document.createElement("div");
      label.className = "liveLabel";
      label.textContent = "worker '" + (w ? w.name : st.selected)
        + "' - chat history";
      st.transcript.appendChild(label);
      for (const e of entries) {
        st.transcript.appendChild(entryEl(e));
      }
      if (w && w.lastError) {
        const err = document.createElement("div");
        err.className = "runError";
        err.textContent = w.lastError;
        st.transcript.appendChild(err);
      }
    }
    if (!st.followTranscript) st.transcript.scrollTop = scrollTop;
    syncTranscriptScroll(st);
  }

        isCurrent: () => request === st.previewRequest && cards.get(st.id) === st });
      if (request !== st.previewRequest || cards.get(st.id) !== st) return;
      st.previewPayload = result.ok ? result.payload : {
        availability: "unavailable", eligible: false, stale: false, steps: [], message: result.message,
      };
      if (st.selected && st.selected.startsWith("preview:")) {
        const worker = st.workers.get(st.selected.slice("preview:".length));
        const data = mapPreviewPayload(st.previewPayload, worker);
        if (worker) renderPreviewPanel(st, worker, data || st.previewPayload);
      }
      renderGraph(st);
    };
    refreshPreview();

    st.handlers = {
      state(state) {
        if (state.stateEpoch !== undefined || state.stateRevision !== undefined) {
          const stamp = { epoch: state.stateEpoch, revision: state.stateRevision };
          if (!acceptStateStamp(st.stamp, stamp)) return;
          st.stamp = stamp;
        }
        if (Array.isArray(state.queuedUserPrompts)) setQueue(st, state.queuedUserPrompts);
        st.plannerTranscript = state.transcript || [];
        st.approved = !!state.planApproved;
        st.plannerCtx = state.context ? { context: state.context, compacting: !!state.compacting,
          hasSession: !!state.hasSession, compacted: !!state.compacted } : null;
        if (state.started === true) st.started = true;
        updateControls(st);
        applyStateWorkers(st, state, { updateListEntry, refreshPreview });
        // Full state is authoritative and replaces all stale marker flags.
        st.plannerAttention = state.attention === true || state.needsAttention === true;
        st.plannerHumanIntervention = state.humanIntervention === true;
        st.plannerError = state.error === true || !!state.lastError;
        setStatus(state.status);
        renderTranscript(st);
        renderScopePanel(st);
      },
      status(data) {
        // Narrow status events may omit marker fields; omitted fields must not clear state.
        if (Object.prototype.hasOwnProperty.call(data, "attention") || Object.prototype.hasOwnProperty.call(data, "needsAttention")) {
          st.plannerAttention = data.attention === true || data.needsAttention === true;
        }
        if (Object.prototype.hasOwnProperty.call(data, "humanIntervention")) {
          st.plannerHumanIntervention = data.humanIntervention === true;
        }
        if (Object.prototype.hasOwnProperty.call(data, "error") || Object.prototype.hasOwnProperty.call(data, "lastError")) {
          st.plannerError = data.error === true || !!data.lastError;
        } else if (data.status === "failed" || data.status === "error") {
          st.plannerError = true;
        }
        setStatus(data.status);
      },
      entry(entry) {
        st.plannerTranscript.push(entry);
        if (st.selected === null) appendEntry(st, entryEl(entry));
      },
      worker_entry({ workerId, entry }) {
        if (!st.workerTranscripts.has(workerId)) {
          st.workerTranscripts.set(workerId, []);
          if (!st.workers.has(workerId)) st.workers.set(workerId, { id: workerId, name: workerId,
            status: "running", branch: "", role: "implementor", kind: "standard" });
        }
        st.workerTranscripts.get(workerId).push(entry);
        if (st.selected === workerId) appendEntry(st, entryEl(entry));
      },
      worker_spawned({ worker }) {
        st.workers.set(worker.id, worker);
        if (!st.workerTranscripts.has(worker.id)) st.workerTranscripts.set(worker.id, []);
        renderGraph(st); updateListEntry(st); refreshPreview();
      },
      worker_status({ workerId, status, verdict, error, worker }) {
        const w = st.workers.get(workerId);
        if (w) {
          if (worker) Object.assign(w, worker);
          w.status = status;
          if (verdict) w.verdict = verdict;
          w.lastError = error || null;
          if (error) showError("Worker '" + w.name + "' failed. " + error);
          if (st.selected === workerId) { renderTranscript(st); renderScopePanel(st); }
        }
        renderGraph(st); updateListEntry(st); refreshPreview(); renderContextControls(st);
      },
      worker_check({ workerId, checkResults }) {
        const w = st.workers.get(workerId);
        if (!w) return;
        w.checkResults = Array.isArray(checkResults) ? checkResults : [];
        renderGraph(st);
        if (st.selected === workerId) renderScopePanel(st);
      },
      worker_removed({ workerIds }) {
        for (const id of workerIds || []) {
          st.workers.delete(id);
          st.workerTranscripts.delete(id);
          st.scopeLoader.remove(id);
          st.historyLoader.remove(id);
        }
        if (st.selected !== null && !st.workers.has(st.selected)) selectNode(st, null);
        renderGraph(st); updateListEntry(st);
      },
      line_error({ message }) { if (message) showError(message); },
      pipeline(data) {
        const changed = JSON.stringify(data.nodeSettings || null) !== JSON.stringify(st.nodeSettings || null);
        applyPipelineState(st, data);
        // Another tab or the API changed the settings: show them, unless
        // this page is open with possibly unsaved edits.
        if (changed && st.tab !== "pipeline") st.pipeForm.set(st.nodeSettings);
      },
      context({ target, ...fields }) {
        if (target === "planner") st.plannerCtx = fields;
        else {
          const w = st.workers.get(target);
          if (w) Object.assign(w, fields);
        }
        renderContextControls(st);
      },
    };

    const growInput = () => {
      input.style.height = "auto";
      const lineHeight = parseFloat(getComputedStyle(input).lineHeight) || 21;
      const maxHeight = lineHeight * 8 + 16;
      input.style.height = Math.min(input.scrollHeight, maxHeight) + "px";
      input.style.overflowY = input.scrollHeight > maxHeight ? "auto" : "hidden";
    };
    const post = async () => {
      const text = input.value.trim();
      if (!text || st.submitting) return;
      const ticket = st.draft.begin(text);
      st.submitting = true;
      send.disabled = true;
      try {
        const response = await fetch("/api/lines/" + st.id + "/prompts", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (cards.get(st.id) !== st) return;
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          const message = data.error || "The prompt was not sent (HTTP " + response.status + "). Your text is kept.";
          composerError.textContent = message;
          composerError.hidden = false;
          showError(message);
          return;
        }
        await response.json().catch(() => null);
        if (cards.get(st.id) !== st) return;
        if (!st.started) setStatus("running");
        if (st.draft.canClear(ticket, input.value)) {
          input.value = "";
          input.style.height = "";
          input.style.overflowY = "hidden";
        }
        composerError.hidden = true;
        // The 202 stamp is not stored: the stream state with the same revision may arrive later.
        if (!st.started) {
          st.started = true;
          input.placeholder = "Send a prompt";
        }
      } catch {
        if (cards.get(st.id) !== st) return;
        composerError.textContent = "Could not send the prompt. Your text is kept.";
        composerError.hidden = false;
        showError("The prompt was not sent. Check the network connection.");
      } finally {
        st.submitting = false;
        send.disabled = false;
      }
    };
    send.addEventListener("click", post);
    input.addEventListener("input", () => { st.draft.touch(); composerError.hidden = true; growInput(); });
    input.addEventListener("keydown", (e) => {
      const action = promptKeyAction(e);
      if (action === "send") { e.preventDefault(); post(); }
    });

    setStatus(line.status);
    renderGraph(st);
    updateControls(st);

    const entryDot = document.createElement("span");
    entryDot.className = "dot";
    const entryName = document.createElement("span");
    entryName.className = "lname";
    entryName.textContent = line.name;
    const entryCount = document.createElement("span");
    entryCount.className = "lcount";
    const entry = document.createElement("div");
    entry.className = "lineentry";
    entry.dataset.lineId = line.id;
    entry.append(entryDot, entryName, entryCount);
    entry.addEventListener("click", () => selectLine(st.id));
    listEl.appendChild(entry);
    st.card = card;
    st.entry = entry;
    st.entryDot = entryDot;
    st.entryCount = entryCount;
    card.style.display = "none";
    cards.set(line.id, st);
    updateListEntry(st);
    if (selectedLine === null) selectLine(line.id);
  }

  function setQueue(st, list) {
    st.queued = list;
    const ids = new Set(list.map((r) => r.id));
    for (const id of [...st.cancelling]) if (!ids.has(id)) st.cancelling.delete(id);
    for (const id of [...st.queueErrors.keys()]) if (!ids.has(id)) st.queueErrors.delete(id);
    renderQueue(st);
  }

  function renderQueue(st) {
    const pane = st.queuePane;
    pane.textContent = "";
    pane.hidden = st.queued.length === 0 || st.tab !== "line";
    if (st.queued.length === 0) return;
    const ol = document.createElement("ol");
    for (const row of st.queued) {
      const li = document.createElement("li");
      const pos = document.createElement("span");
      pos.className = "qpos";
      pos.textContent = row.position + ".";
      const text = document.createElement("span");
      text.className = "qtext";
      text.textContent = row.text;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "Cancel";
      btn.setAttribute("aria-label", queueRowLabel(row));
      btn.disabled = st.cancelling.has(row.id);
      btn.addEventListener("click", () => cancelQueued(st, row));
      li.append(pos, text, btn);
      if (st.queueErrors.has(row.id)) {
        const err = document.createElement("div");
        err.className = "qerr";
        err.setAttribute("role", "alert");
        err.textContent = st.queueErrors.get(row.id);
        li.append(err);
      }
      ol.append(li);
    }
    pane.append(ol);
  }

  async function cancelQueued(st, row) {
    const id = row.id;
    if (st.cancelling.has(id)) return;
    st.cancelling.add(id);
    st.queueErrors.delete(id);
    renderQueue(st);
    let failed = true;
    try {
      const res = await fetch("/api/lines/" + st.id + "/prompts/" + encodeURIComponent(id), { method: "DELETE" });
      if (cards.get(st.id) !== st) return;
      if (res.ok) {
        failed = false;
        const body = await res.json().catch(() => null);
        if (cards.get(st.id) !== st) return;
        const stamp = body && { epoch: body.stateEpoch, revision: body.stateRevision };
        if (stamp && Array.isArray(body.queuedUserPrompts) && acceptStateStamp(st.stamp, stamp)) {
          st.stamp = stamp;
          st.cancelling.delete(id);
          setQueue(st, body.queuedUserPrompts);
          return;
        }
      }
    } catch {}
    if (cards.get(st.id) !== st) return;
    st.cancelling.delete(id);
    if (failed) {
      st.queueErrors.set(id, "Could not cancel: the prompt may have started.");
      refreshStream();
    }
    renderQueue(st);
  }

  function removeCard(id) {
    const st = cards.get(id);
    if (st) {
      st.scopeLoader.clear();
      st.historyLoader.clear();
      st.transcriptResizeObserver.disconnect();
      st.pipeForm.dispose();
      st.card.remove();
      st.entry.remove();
      cards.delete(id);
    }
    if (selectedLine === id) {
      const next = cards.keys().next();
      selectLine(next.done ? null : next.value);
    }
  }

  function statusMarkerState(st) {
    return { status: st.plannerStatus, attention: st.plannerAttention,
      humanIntervention: st.plannerHumanIntervention, error: st.plannerError };
  }

  function updateStatusMarker(st) {
    const markerStateValue = lineMarkerState(statusMarkerState(st), [...st.workers.values()]);
    for (const marker of [st.dot, st.entryDot]) {
      if (!marker) continue;
      marker.className = "dot " + markerStateValue.className;
      marker.setAttribute("aria-label", markerStateValue.label);
    }
  }

  function updateListEntry(st) {
    if (!st.entry) return;
    updateStatusMarker(st);
    st.entryCount.textContent = st.workers.size ? st.workers.size + "w" : "";
  }


  // "Change the pipeline" section of the Pipeline tab: pick, Check (dry run), map orphan nodes, Apply.
  function createGraphSwitch(st) {
    const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
    const el = mk("section", "pipeSwitch");
    const id = "sw-" + st.id;
    el.setAttribute("aria-labelledby", id + "-title");
    const title = mk("h3", "", "Change the pipeline");
    title.id = id + "-title";
    const note = mk("p", "pipeNote", "Choose another pipeline to change the graph. Workers that already ran move to nodes of the new pipeline.");
    const row = mk("div", "swPick");
    const label = mk("label", "", "Pipeline");
    label.htmlFor = id + "-pick";
    const pick = mk("select"); pick.id = id + "-pick";
    const checkBtn = mk("button", "secondary", "Check");
    checkBtn.type = "button";
    row.append(label, pick, checkBtn);
    const status = mk("div", "swStatus"); status.setAttribute("role", "status"); status.hidden = true;
    const alertBox = mk("div", "createErr"); alertBox.setAttribute("role", "alert"); alertBox.hidden = true;
    const remapBox = mk("div", "swRemap"); remapBox.hidden = true;
    const dropped = mk("p", "swDropped"); dropped.hidden = true;
    const applyBtn = mk("button", "", "Apply"); applyBtn.type = "button"; applyBtn.disabled = true;
    el.append(title, note, row, status, alertBox, remapBox, dropped, applyBtn);

    let list = [], loaded = false, model = null, choices = {}, busy = false, pending = false, seq = 0;
    const current = () => (st.pipeGraph && st.pipeGraph.name) || "";
    let seenName = current();
    const url = "/api/lines/" + encodeURIComponent(st.id) + "/graph";
    const post = async (body) => {
      try {
        const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        return { status: res.status, body: await res.json().catch(() => ({})) };
      } catch { return { status: 0, body: { error: "The request failed. Check the connection and try again." } }; }
    };
    const sync = () => {
      pick.disabled = busy;
      checkBtn.disabled = busy || !pick.value;
      const complete = !!model && model.canApply && remapComplete(model.orphanRows, choices);
      applyBtn.disabled = busy || pending || !complete;
      for (const s of remapBox.querySelectorAll("select")) s.disabled = busy;
    };
    const show = (kind, text) => {
      status.hidden = kind !== "status" || !text;
      alertBox.hidden = kind !== "alert" || !text;
      status.textContent = kind === "status" ? text || "" : "";
      alertBox.textContent = kind === "alert" ? text || "" : "";
    };
    const showDropped = () => {
      const list2 = model ? model.droppedSettings : [];
      dropped.hidden = !list2.length;
      dropped.textContent = list2.length ? "Settings of these nodes will be dropped: " + list2.join(", ") + "." : "";
    };
    const renderOptions = () => {
      const keep = pick.value;
      pick.innerHTML = "";
      const names = list.length ? list : (current() ? [{ name: current() }] : []);
      for (const p of names) {
        const o = mk("option", "", pipelineOptionLabel(p.name === current() ? { ...p, name: p.name + " (current)" } : p));
        o.value = p.name;
        pick.appendChild(o);
      }
      if (!names.length) { const o = mk("option", "", "No pipelines available"); o.value = ""; pick.appendChild(o); }
      pick.value = names.some((p) => p.name === keep) ? keep : current();
      sync();
    };
    const renderResult = () => {
      remapBox.textContent = ""; remapBox.hidden = true;
      if (!model) { show(null); showDropped(); return sync(); }
      const bad = model.state === "error" || model.state === "blocked";
      let text = model.message;
      if (model.state === "ready" && model.moves.length) {
        text += " " + model.moves.map((m) => m.name + ": " + m.from + " -> " + m.to).join("; ") + ".";
      }
      show(bad ? "alert" : "status", text);
      if (model.state === "needs-remap") {
        remapBox.hidden = false;
        const table = mk("table", "swTable");
        table.setAttribute("aria-label", "Map the nodes that do not exist in the new pipeline");
        const head = mk("thead"); const hr = mk("tr");
        for (const h of ["Old node", "Workers", "New node"]) { const th = mk("th", "", h); th.scope = "col"; hr.appendChild(th); }
        head.appendChild(hr); table.appendChild(head);
        const body = mk("tbody");
        for (const o of model.orphanRows) {
          const tr = mk("tr");
          const th = mk("th", "", o.node); th.scope = "row";
          th.appendChild(mk("span", "swPhase", " (" + o.phase + ")"));
          const cnt = mk("td", "", o.workers + (o.workers === 1 ? " worker" : " workers"));
          cnt.dataset.label = "Workers"; cnt.title = o.workerNames.join(", ");
          const td = mk("td"); td.dataset.label = "New node";
          const sel = mk("select"); sel.id = id + "-map-" + o.node; sel.dataset.node = o.node;
          sel.setAttribute("aria-label", "New node for " + o.node);
          const empty = mk("option", "", "Choose a node..."); empty.value = ""; sel.appendChild(empty);
          for (const c of o.candidates) { const op = mk("option", "", c); op.value = c; sel.appendChild(op); }
          sel.value = choices[o.node] || "";
          sel.addEventListener("change", () => { choices[o.node] = sel.value; recheck(); });
          td.appendChild(sel); tr.append(th, cnt, td); body.appendChild(tr);
        }
        table.appendChild(body); remapBox.appendChild(table);
      }
      showDropped();
      sync();
    };
    // After a choice: ask the router again with the mapping, so the dropped settings and errors are current.
    const recheck = async () => {
      const mine = ++seq;
      model.droppedSettings = []; showDropped();
      if (!remapComplete(model.orphanRows, choices)) { pending = false; model.canApply = false; show("status", model.message); return sync(); }
      pending = true; sync();
      const out = await post(buildGraphChangeBody(pick.value, choices, true));
      if (mine !== seq) return;
      pending = false;
      const v = graphSwitchView(out.status, out.body);
      model.canApply = v.state === "ready";
      if (model.canApply) { model.droppedSettings = v.droppedSettings; show("status", "Ready. " + v.moves.length + (v.moves.length === 1 ? " worker moves" : " workers move") + " to the new nodes."); }
      else show("alert", v.message || "The mapping is not valid.");
      showDropped();
      sync();
    };
    const reset = () => { seq++; pending = false; model = null; choices = {}; renderResult(); };
    const load = async () => {
      try {
        const res = await fetch("/api/pipelines");
        if (res.ok) { list = pickerPipelines((await res.json()).pipelines); loaded = true; }
      } catch {}
      renderOptions();
    };
    pick.addEventListener("change", () => { if (!busy) reset(); });
    checkBtn.addEventListener("click", async () => {
      if (busy || !pick.value) return;
      reset(); busy = true; sync(); show("status", "Checking...");
      const out = await post(buildGraphChangeBody(pick.value, null, true));
      busy = false;
      model = graphSwitchView(out.status, out.body);
      choices = {};
      for (const r of model.orphanRows) if (r.choice) choices[r.node] = r.choice;
      if (model.state === "needs-remap") model.canApply = false;
      renderResult();
      if (model.state === "needs-remap" && remapComplete(model.orphanRows, choices)) recheck();
    });
    applyBtn.addEventListener("click", async () => {
      if (busy || !model || applyBtn.disabled) return;
      const name = pick.value;
      busy = true; sync(); show("status", "Applying...");
      const out = await post(buildGraphChangeBody(name, choices, false));
      busy = false;
      if (out.status !== 200) {
        const v = graphSwitchView(out.status, out.body);
        show("alert", v.message || (out.body && out.body.error) || "The pipeline could not be changed.");
        return sync();
      }
      applyPipelineState(st, out.body);
      st.pipeForm.set(st.nodeSettings);
      seenName = current(); reset(); renderOptions();
      show("status", "Pipeline changed to " + name + ". " + (out.body.noticeQueued
        ? "The planner was told."
        : "The line has not started, so no notice was needed."));
    });
    return {
      el,
      open() { if (!loaded) load(); else renderOptions(); },
      // The graph changed (own apply or the "pipeline" event): relabel and drop a stale check.
      graphChanged() {
        if (seenName === current()) return;
        seenName = current();
        reset(); renderOptions();
      },
    };
  }

  // Take the graph and the settings of a line from an API answer or a "pipeline" event.
  function applyPipelineState(st, data) {
    if (data.graph) st.pipeGraph = data.graph;
    st.nodeSettings = data.nodeSettings || null;
    st.effectiveNodeSettings = data.effectiveNodeSettings || null;
    st.defaultNodeSettings = data.defaultNodeSettings || null;
    renderPipelineGraph(st);
    renderGraph(st);
    st.pipeForm.setDefaults(st.defaultNodeSettings);
    if (st.pipeSwitch) st.pipeSwitch.graphChanged();
  }

  // The graph view of the Pipeline tab: one box per node (id, type, harness / model)
  // and one arrow per edge, laid out by layoutGraph. The same edges follow as text.
  function renderPipelineGraph(st) {
    const box = st.pipeGraphBox;
    box.textContent = "";
    st.pipeEdgesList.textContent = "";
    const graph = st.pipeGraph;
    const layout = layoutGraph(graph);
    if (!layout.nodes.length) {
      const none = document.createElement("p");
      none.className = "pipeNote";
      none.textContent = "This line has no pipeline graph.";
      box.appendChild(none);
      return;
    }
    const rows = nodeRowsFromGraphView(graph);
    const rowKey = JSON.stringify(rows.map((r) => [r.id, r.maxContext]));
    if (st.pipeRowKey !== rowKey) {
      if (st.pipeRowKey !== undefined) { st.pipeForm.setRows(rows); st.pipeForm.set(st.nodeSettings); }
      st.pipeRowKey = rowKey;
    }
    const el = (name, attrs, text) => {
      const node = document.createElementNS(SVGNS, name);
      for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
      if (text !== undefined) node.textContent = text;
      return node;
    };
    const svg = el("svg", { class: "pipeGraph", role: "img", width: layout.width, height: layout.height,
      viewBox: "0 0 " + layout.width + " " + layout.height,
      "aria-label": "Pipeline graph " + (graph.name || "") + ": " + layout.nodes.length + " nodes, "
        + layout.edges.length + " edges. The edges follow as a text list." });
    svg.appendChild(el("title", {}, "Pipeline graph " + (graph.name || "")));
    const defs = el("defs");
    const marker = el("marker", { id: "pgArrow-" + st.id, viewBox: "0 0 10 10", refX: 9, refY: 5,
      markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
    marker.appendChild(el("path", { d: "M0 0 L10 5 L0 10 z", class: "pgArrowHead" }));
    defs.appendChild(marker);
    svg.appendChild(defs);
    const edgeLayer = el("g", { class: "pgEdges" });
    const labelLayer = el("g", { class: "pgLabels" });
    for (const edge of layout.edges) {
      if (!edge) continue;
      edgeLayer.appendChild(el("path", { d: edge.path, class: "pgEdge" + (edge.dashed ? " dashed" : ""),
        "marker-end": "url(#pgArrow-" + st.id + ")" }));
      labelLayer.appendChild(el("text", { x: edge.labelX, y: edge.labelY, class: "pgEdgeLabel",
        "text-anchor": "middle", "dominant-baseline": "central" }, edge.label));
    }
    svg.append(edgeLayer);
    const eff = st.effectiveNodeSettings || {};
    for (const n of layout.nodes) {
      const g = el("g", { class: "pgNode" + (n.id === graph.start ? " start" : ""), "data-node": n.id });
      g.appendChild(el("rect", { x: n.x, y: n.y, width: n.width, height: n.height, rx: 6 }));
      g.appendChild(el("text", { x: n.x + 10, y: n.y + 21, class: "pgNodeId" }, n.id));
      g.appendChild(el("text", { x: n.x + 10, y: n.y + 38, class: "pgNodeType" }, n.type || ""));
      g.appendChild(el("text", { x: n.x + 10, y: n.y + 55, class: "pgNodeCfg" }, nodeSummaryText(eff[n.id])));
      svg.appendChild(g);
    }
    // Labels last, so no box or arrow hides them.
    svg.appendChild(labelLayer);
    box.appendChild(svg);
    for (const line of edgeTextLines(graph)) {
      const li = document.createElement("li");
      li.textContent = line;
      st.pipeEdgesList.appendChild(li);
    }

  function setLineTab(st, tab) {
    st.tab = tab;
    st.tabLineBtn.classList.toggle("active", tab === "line");
    st.tabProcBtn.classList.toggle("active", tab === "processes");
    st.tabEvBtn.classList.toggle("active", tab === "evidence");
    st.tabPipeBtn.classList.toggle("active", tab === "pipeline");
    for (const el of [st.graphDetails, st.transcriptWrap, st.chatHandle, st.row]) {
      el.hidden = tab !== "line";

    // Conditional panels: restore only what the line state shows. renderGraph
    // re-opens the preview panel when a preview node is selected.
    const planInDetails = st.planBody.parentNode === st.planDetails;
    st.plan.hidden = tab !== "line" || planInDetails;
    st.planDetails.hidden = tab !== "line" || !planInDetails;
    st.previewPanel.hidden = true;
    renderScopePanel(st);
    renderQueue(st);
    st.procPane.hidden = tab !== "processes";
    st.evPane.hidden = tab !== "evidence";
    st.pipePane.hidden = tab !== "pipeline";
    st.workPane.hidden = tab !== "work";
    st.tabWorkBtn.classList.toggle("active", tab === "work");
    if (tab === "work") {
      if (!st.work) st.work = registryLine.mount(document, st.workPane, { fetch: (u, o) => fetch(u, o), window, lineId: st.id });
      st.work.load();

    if (tab === "pipeline") {
      st.pipeForm.open();
      st.pipeSwitch.open();

    if (tab === "processes") pollInventory();
    if (tab === "evidence") pollEvidence();
    if (tab === "line") {

    const pane = st.procPane;

  async function pollEvidence() {
    const st = cards.get(selectedLine);
    if (!st || st.tab !== "evidence") return;
    const gen = (st.evidenceGen = (st.evidenceGen || 0) + 1);
    const lineId = st.id;
    try {
      const res = await fetch("/api/lines/" + lineId + "/evidence");
      if (!res.ok || !evidencePollIsCurrent(st, lineId, gen, selectedLine, cards.get(lineId))) return;
      const response = await res.json();
      if (!evidencePollIsCurrent(st, lineId, gen, selectedLine, cards.get(lineId))) return;
      st.evidenceResponse = response;
      renderEvidence(st, response);
    } catch {}
  }

  async function pollInventory() {
    const st = cards.get(selectedLine);
    if (!st || st.tab !== "processes") return;
    const gen = (st.invGen = (st.invGen || 0) + 1);
    try {
      const res = await fetch("/api/lines/" + st.id + "/inventory");
      if (!res.ok) return;
      const { items } = await res.json();
      if (gen !== st.invGen || st.tab !== "processes" || selectedLine !== st.id) return;
      renderLineProcesses(st, items);
    } catch {}
  }

  async function pollPlans() {
    for (const st of cards.values()) {
      try {
        const res = await fetch("/api/lines/" + st.id + "/plan");
        const data = await res.json();
        if (data.approved !== st.approved) {
          st.approved = data.approved;
          updateControls(st);
        }
        const content = data.exists ? data.content : null;
        if (content !== st.planContent) {
          st.planContent = content;
          st.waiting.hidden = content !== null;
          updateControls(st);
          st.planBody.innerHTML = "";
          if (content !== null) renderPlan(st, content);
        }
      } catch {}
    }
  }

  async function refresh() {
    try {
      const res = await fetch("/api/lines");
      const { lines } = await res.json();
      const present = new Set(lines.map((l) => l.id));
      for (const id of [...cards.keys()]) {
        if (!present.has(id)) removeCard(id);
      }
      for (const line of lines) {
        if (!cards.has(line.id)) { addCard(line); continue; }
        const st = cards.get(line.id);
        if (line.started && !st.started) {
          st.started = true;
          st.input.placeholder = "Send a prompt";
        }
        if (st.entryCount) st.entryCount.textContent = line.workers ? line.workers + "w" : "";
      }
    } catch {}
  }

  // --- creation panel ---
  const createBtn = document.getElementById("create");

  createPanel.id = "createPanel";
  createPanel.hidden = true;
  const cpTitle = document.createElement("h2");
  cpTitle.textContent = "Create a production line";
  createPanel.appendChild(cpTitle);

  const mkLabel = (text, inputEl) => {
    const l = document.createElement("label");
    l.textContent = text;
    l.htmlFor = inputEl.id;
    return l;
  };

  const nameInput = document.createElement("input");
  nameInput.id = "cp-name";
  nameInput.placeholder = "optional";
  createPanel.append(mkLabel("Name", nameInput), nameInput);

  const repoInput = document.createElement("input");
