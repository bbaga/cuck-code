  // Installed harnesses, shared by every pipeline form. A form asks for a
  // reload when it opens; concurrent reloads share one request. The reload
  // asks the server to re-probe (refresh=1): the probe cache may predate a
  // harness installation, and a cached answer must not hide it. A failed
  // load keeps the previous list but reports the error, so stale data is
  // never presented as current.
  let installedHarnesses = [];
  let harnessMissingText = "";
  let harnessErrorText = "";
  let harnessPluginProblems = [];
  let harnessRequest = null;
  const harnessListeners = new Set();
  function reloadHarnesses() {
    if (harnessRequest) return harnessRequest;
    harnessRequest = (async () => {
      let outcome;
      try {
        const res = await fetch("/api/harnesses?refresh=1");
        const data = await res.json().catch(() => null);
        outcome = harnessReloadOutcome({ ok: res.ok, status: res.status, data,
          previous: installedHarnesses, previousMissingText: harnessMissingText,
          previousPluginProblems: harnessPluginProblems });
      } catch (err) {
        outcome = harnessReloadOutcome({ ok: false, status: 0, fetchError: err,
          previous: installedHarnesses, previousMissingText: harnessMissingText,
          previousPluginProblems: harnessPluginProblems });
      }
      installedHarnesses = outcome.harnesses;
      harnessMissingText = outcome.missingText;
      harnessPluginProblems = outcome.pluginProblems;
      harnessErrorText = outcome.errorText;
      // A throwing listener must not leave the slot set: every later reload
      // would return the same settled promise and the catalog would never
      // refresh again. The rejection stays visible for the caller.
      try {
        for (const listener of harnessListeners) listener();
      } finally {
        harnessRequest = null;
      }
    })();
    return harnessRequest;
  }

  // Rebuild the options of a select, keeping its default "" option and its
  // current value when that value still exists.
  function setSelectOptions(sel, options) {
    const current = sel.value;
    for (const o of [...sel.options]) if (o.value !== "") o.remove();
    for (const opt of options) {
      const o = document.createElement("option");
      o.value = opt.value;
      o.textContent = opt.label;
      sel.appendChild(o);
    }
    sel.value = [...sel.options].some((o) => o.value === current) ? current : "";
  }

  // Select a value, adding it as an option first when the current choices
  // do not list it (a saved model the metadata does not know, or a harness
  // that is not installed here).
  function selectValue(sel, value, missingLabel) {
    const v = typeof value === "string" ? value : "";
    if (v && ![...sel.options].some((o) => o.value === v)) {
      const o = document.createElement("option");
      o.value = v;
      o.textContent = v + (missingLabel ? " (" + missingLabel + ")" : "");
      sel.appendChild(o);
    }
    sel.value = v;
  }

  // One pipeline settings form: a row per graph node with harness, Pi auth
  // mode, model, effort, and (for resumed nodes) max context. Used by the
  // create panel and by each line's Pipeline page. `rowSpecs` (from
  // nodeRowsFromResolved or nodeRowsFromGraphView) gives the rows. read()
  // returns { nodeSettings } or { error }; set() fills the form from a map
  // from node id to settings; setRows() swaps the rows later.
  function createPipelineForm(idPrefix, rowSpecs) {
    const el = document.createElement("div");
    el.className = "pipeForm";
    const harnessSelects = {}, authModeSelects = {}, modelSelects = {},
      effortSelects = {}, authHints = {}, maxContextInputs = {};
    const phaseState = {};
    // Per-row hydration state: the settings the row was filled from, user
    // edit flags (a late hydration answer must never overwrite them), and
    // request flags. piDetailLoaded is true only after a real detail
    // applied; a failed load stays retryable. piLoading belongs to the
    // active request; a stale answer never touches it. rowGen binds
    // requests to the row instance (a rebuild restarts the token count).
    const savedSettings = {}, rowTouched = {}, modelTouched = {}, piDetailLoaded = {},
      piLoading = {}, hydrateSig = {}, piSavedModel = {};
    let rowGeneration = 0;
    const rowGen = {};
    let rows = [];
    // Server default settings per node id; they label the empty options.
    let rowDefaults = {};
    // Fields the form has no control for (timeLimit) survive a set/read.
    let extraFields = {};
    const authSummary = document.createElement("div");
    authSummary.className = "authSummary";
    el.appendChild(authSummary);
    // Created only when a plugin failed, so no empty element stays.
    let pluginWarning = null;

    function buildRows(specs) {
      for (const old of [...el.querySelectorAll(".phaseRow")]) old.remove();
      for (const m of [harnessSelects, authModeSelects, modelSelects, effortSelects, authHints,
        maxContextInputs, phaseState, savedSettings, rowTouched, modelTouched, piDetailLoaded,
        piLoading, hydrateSig, piSavedModel]) {
        for (const k of Object.keys(m)) delete m[k];
      }
      rows = specs;
      for (const { key, title, maxContext } of specs) {
        const row = document.createElement("div");
        row.className = "phaseRow nodeRow";
        const phaseName = document.createElement("span");
        phaseName.className = "phaseName";
        phaseName.textContent = title || key;
        const mkSelect = (kind, label) => {
          const sel = document.createElement("select");
          sel.id = idPrefix + "-" + kind + "-" + key;
          sel.setAttribute("aria-label", key + " " + label);
          const def = document.createElement("option");
          def.value = "";
          def.textContent = "default";
          sel.appendChild(def);
          return sel;
        };
        const hSel = mkSelect("harness", "harness");
        const amSel = mkSelect("authmode", "authentication mode");
        amSel.hidden = true;
        amSel.disabled = true;
        const mSel = mkSelect("model", "model");
        const eSel = mkSelect("effort", "effort");
        for (const level of EFFORT_LEVELS) {
          const o = document.createElement("option");
          o.value = level;
          o.textContent = level;
          eSel.appendChild(o);
        }
        const hint = document.createElement("div");
        hint.className = "authHint";
        row.append(phaseName, hSel, amSel, mSel, eSel);
        if (maxContext) {
          const ctxIn = document.createElement("input");
          ctxIn.id = idPrefix + "-maxctx-" + key;
          ctxIn.placeholder = "max ctx";
          ctxIn.title = "Max context window, e.g. 200K or 50K. The session is compacted when it reaches this size. Empty uses the router default.";
          ctxIn.setAttribute("aria-label", key + " max context window");
          ctxIn.addEventListener("change", () => { rowTouched[key] = true; });
          row.appendChild(ctxIn);
          maxContextInputs[key] = ctxIn;
        }
        row.appendChild(hint);
        el.insertBefore(row, authSummary);
        harnessSelects[key] = hSel;
        authModeSelects[key] = amSel;
        modelSelects[key] = mSel;
        effortSelects[key] = eSel;
        authHints[key] = hint;
        phaseState[key] = clearHarnessState(null);
        rowGen[key] = ++rowGeneration;
        // A user edit marks the row: late answers must not overwrite it.
        hSel.addEventListener("change", () => { rowTouched[key] = true; onHarnessChange(key); relabelDefaults(key); });
        amSel.addEventListener("change", () => { rowTouched[key] = true; loadPiModels(key, ""); });
        mSel.addEventListener("change", () => { rowTouched[key] = true; modelTouched[key] = true; });
        eSel.addEventListener("change", () => { rowTouched[key] = true; });
        relabelDefaults(key);
      }
    }

    // Show the real default values in the empty options of a row.
    function relabelDefaults(key) {
      if (!harnessSelects[key]) return;
      const labels = defaultOptionLabels(rowDefaults[key], harnessSelects[key].value);
      const setEmpty = (sel, text) => {
        const empty = [...sel.options].find((o) => o.value === "");
        if (empty) empty.textContent = text;
      };
      setEmpty(harnessSelects[key], labels.harness);
      setEmpty(modelSelects[key], labels.model);
      setEmpty(effortSelects[key], labels.effort);
      if (maxContextInputs[key]) maxContextInputs[key].placeholder = labels.maxContext;
    }

    function setDefaults(map) {
      rowDefaults = map || {};
      for (const { key } of rows) relabelDefaults(key);
    }
    buildRows(rowSpecs.map((r) => ({ key: r.id, title: r.title, maxContext: r.maxContext })));
    function syncPhaseRow(key) {
      const state = phaseState[key];
      const harness = harnessSelects[key].value;
      const amSel = authModeSelects[key];
      // The pure state resets the value to "" for every non-Pi harness, so a
      // stale selected mode cannot survive a harness change. A saved provider
      // the catalog does not know stays listed, honestly labeled.
      const hasProviders = harnessHasProviders(installedHarnesses, harness);
      const piOptions = hasProviders
        ? [...authModeOptions(installedHarnesses, harness)] : [];
      if (hasProviders && amSel.value
        && !piOptions.some((o) => o.value === amSel.value)) {
        piOptions.push({ value: amSel.value, label: amSel.value + " (not in catalog)" });
      }
      const amState = authModeSelectState({
        harnessId: harness,
        harnesses: installedHarnesses,
        options: piOptions,
        currentValue: amSel.value,
      });
      setSelectOptions(amSel, amState.options);
      amSel.value = amState.value;
      amSel.hidden = amState.hidden;
      amSel.disabled = amState.disabled;
      // While a hydration's answer is in flight, the saved model stays
      // visible (raw id); the answer replaces it when it applies.
      const prevModel = modelSelects[key].value;
      setSelectOptions(modelSelects[key], state.models);
      if (piLoading[key] && prevModel && prevModel === piSavedModel[key]
        && modelSelects[key].value !== prevModel) selectValue(modelSelects[key], prevModel);
      authHints[key].textContent = state.statusText || baseAuthHintText(key);
      relabelDefaults(key);
    }

    function baseAuthHintText(key) {
      const id = harnessSelects[key].value;
      const entry = installedHarnesses.find((h) => h.id === id);
      if (!entry) return "";
      const badge = authBadge(entry);
      if (badge === "missing")
        return entry.id + ": auth missing - run " + (entry.loginHint || entry.id + " login");
      // vibe and pi have no provider-free auth probe, so their base state is
      // honestly "not probed"; pi shows the real state after a mode is chosen.
      if (badge === "unknown") return entry.id + ": installed (auth not probed)";
      return entry.id + ": " + badge;
    }

    function updateAuthHint(key) {
      authHints[key].textContent = phaseState[key].statusText || baseAuthHintText(key);
    }

    function onHarnessChange(key) {
      // New harness: drop the auth mode, model, models, status, and hints, and
      // invalidate any in-flight Pi detail fetch for this row.
      const state = phaseState[key];
      state.tracker.next();
      const next = clearHarnessState(state);
      next.models = modelOptionsForPhase({
        harnesses: installedHarnesses,
        harnessId: harnessSelects[key].value,
        piDetail: null,
      });
      // Explicitly reset the auth mode select before it is hidden or filled.
      // The tracker invalidation ends any in-flight request: release its flag.
      authModeSelects[key].value = "";
      piDetailLoaded[key] = false;
      piLoading[key] = false;
      phaseState[key] = next;
      syncPhaseRow(key);
    }

    // Load the chosen provider's models. A hydration passes its savedModel:
    // it is re-selected when the answer applies, unless the user edited it.
    async function loadPiModels(key, savedModel) {
      const state = phaseState[key];
      const provider = authModeSelects[key].value;
      const harnessId = harnessSelects[key].value;
      // Bind the request to the row instance: a rebuild restarts tokens.
      const gen = rowGen[key];
      // New mode: drop provider-specific state and invalidate older fetches.
      state.tracker.next();
      piDetailLoaded[key] = false;
      piLoading[key] = false;
      phaseState[key] = clearProviderState(state);
      if (!provider) { syncPhaseRow(key); return; }
      piLoading[key] = true;
      piSavedModel[key] = savedModel;
      syncPhaseRow(key);
      const token = phaseState[key].tracker.next();
      const result = await fetchPiDetail({
        url: providerDetailUrl(harnessId, provider),
        fetchImpl: fetch,
        isCurrent: (t) => !!phaseState[key] && rowGen[key] === gen
          && phaseState[key].tracker.isCurrent(t),
        token,
      });
      // A stale answer (superseded request, rebuilt row, harness change)
      // belongs to someone else: it never touches flag or state.
      if (result.stage === "stale-after-fetch") return;
      if (result.stage === "fetch-error") {
        if (result.current && phaseState[key]) {
          piLoading[key] = false;
          phaseState[key].statusText = result.error;
          updateAuthHint(key);
        }
        return;
      }
      // Recheck after the async json() step: a newer selection must win.
      const outcome = piDetailApply({
        isCurrent: result.current,
        ok: result.ok,
        status: result.status,
        data: result.data,
        harnessId,
      });
      if (!outcome.apply || !phaseState[key]) return;
      piLoading[key] = false;
      // Only a real detail counts as loaded: a failed answer stays retryable.
      if (outcome.piDetail) piDetailLoaded[key] = true;
      phaseState[key].piDetail = outcome.piDetail;
      phaseState[key].models = outcome.models;
      // The shared apply helper words the state for Pi; name this harness.
      phaseState[key].statusText = outcome.piDetail
        ? authStatusText(outcome.piDetail, harnessId) : outcome.statusText;
      syncPhaseRow(key);
      // A hydration re-applies its saved model unless the user edited it.
      if (savedModel && !modelTouched[key]) selectValue(modelSelects[key], savedModel);
    }

    // Base metadata arrived: refresh harness options, auth mode options and
    // model choices (Vibe and Claude rows pick up their models here; Pi rows
    // wait for a mode).
    function applyHarnesses() {
      for (const { key } of rows) {
        const sel = harnessSelects[key];
        const current = sel.value;
        const model = modelSelects[key].value;
        for (const o of [...sel.options]) if (o.value !== "") o.remove();
        for (const h of installedHarnesses) {
          const o = document.createElement("option");
          o.value = h.id;
          o.textContent = harnessOptionLabel(h);
          if (h.plugin && h.plugin.folder) o.title = h.plugin.folder;
          sel.appendChild(o);
        }
        selectValue(sel, current, "not installed");
        if (!harnessHasProviders(installedHarnesses, sel.value)) {
          phaseState[key].models = modelOptionsForPhase({
            harnesses: installedHarnesses,
            harnessId: sel.value,
            piDetail: null,
          });
        }
        syncPhaseRow(key);
        selectValue(modelSelects[key], model);
        // A saved provider without a loaded answer (late catalog) loads
        // now, but only for an untouched row.
        const saved = savedSettings[key];
        if (!rowTouched[key] && saved && harnessHasProviders(installedHarnesses, sel.value)) {
          const provider = typeof saved.authMode === "string" && saved.authMode
            ? saved.authMode : providerFromModel(saved.model);
          if (provider && authModeOptions(installedHarnesses, sel.value).some((o) => o.value === provider)
            && (authModeSelects[key].value !== provider || (!piDetailLoaded[key] && !piLoading[key]))) {
            selectValue(authModeSelects[key], provider);
            loadPiModels(key, typeof saved.model === "string" ? saved.model : "");
          }
        }
      }
      const problems = pluginProblemsSummary(harnessPluginProblems);
      if (problems && !pluginWarning) {
        pluginWarning = document.createElement("div");
        pluginWarning.className = "authSummary pluginProblems";
        el.insertBefore(pluginWarning, authSummary);
      }
      if (problems) {
        pluginWarning.textContent = problems.text;
        pluginWarning.title = problems.title;
      } else if (pluginWarning) {
        pluginWarning.remove();
        pluginWarning = null;
      }
      authSummary.textContent = [harnessErrorText, harnessMissingText].filter(Boolean).join(" ");
    }
    harnessListeners.add(applyHarnesses);

    // Fill one row from saved settings (a nodeSettings entry, or a snapshot
    // of typed values): harness, Pi provider, model, effort, max context,
    // and the hidden timeLimit. The provider comes from an explicit authMode
    // or the provider-qualified model; a provider the catalog does not know
    // stays selected, labeled "(not in catalog)" — no silent default. The
    // same saved settings over untouched controls keep the loaded answer.
    function hydrateRow(key, cfg) {
      const saved = cfg && typeof cfg === "object" ? { ...cfg } : {};
      const model = typeof saved.model === "string" ? saved.model : "";
      const provider = typeof saved.authMode === "string" && saved.authMode
        ? saved.authMode : providerFromModel(model);
      const sameSaved = JSON.stringify(saved) === hydrateSig[key] && !rowTouched[key]
        && (!harnessHasProviders(installedHarnesses, harnessSelects[key].value) || !provider
          || piDetailLoaded[key] || piLoading[key]);
      hydrateSig[key] = JSON.stringify(saved);
      savedSettings[key] = saved;
      rowTouched[key] = false;
      modelTouched[key] = false;
      selectValue(harnessSelects[key], saved.harness, "not installed");
      if (!sameSaved) onHarnessChange(key);
      if (harnessHasProviders(installedHarnesses, harnessSelects[key].value) && provider) {
        selectValue(authModeSelects[key], provider);
        if (!sameSaved) {
          syncPhaseRow(key);
          // Only a catalog-known provider gets its models fetched.
          if (authModeOptions(installedHarnesses, harnessSelects[key].value).some((o) => o.value === provider)) {
            loadPiModels(key, model);
          }
        }
      }
      selectValue(modelSelects[key], model);
      effortSelects[key].value = EFFORT_LEVELS.includes(saved.effort) ? saved.effort : "";
      if (maxContextInputs[key]) {
        const mc = saved.maxContext;
        maxContextInputs[key].value = typeof mc === "number"
          ? (mc ? formatTokens(mc) : "") : (mc ? String(mc) : "");
      }
      if (saved.timeLimit) extraFields[key] = { timeLimit: saved.timeLimit };
    }

    function set(pipeline) {
      const p = pipeline && typeof pipeline === "object" ? pipeline : {};
      extraFields = {};
      for (const { key } of rows) {
        hydrateRow(key, p[key] && typeof p[key] === "object" ? p[key] : {});
      }
    }

    // The typed values per row key, as read() would send them (no validation).
    function snapshot() {
      const out = {};
      for (const { key } of rows) {
        out[key] = { harness: harnessSelects[key].value, model: modelSelects[key].value,
          effort: effortSelects[key].value,
          maxContext: maxContextInputs[key] ? maxContextInputs[key].value : "",
          authMode: authModeSelects[key].value, timeLimit: (extraFields[key] || {}).timeLimit };
      }
      return out;
    }

    // Replace the rows; kept node ids keep their typed values via hydrateRow.
    function setRows(specs) {
      const old = snapshot();
      buildRows(specs.map((r) => ({ key: r.id, title: r.title, maxContext: r.maxContext })));
      extraFields = {};
      for (const { key } of rows) {
        hydrateRow(key, old[key] || {});
      }
      applyHarnesses();
    }

    function read() {
      const values = {};
      for (const { key } of rows) {
        values[key] = {
          ...(extraFields[key] || {}),
          harness: harnessSelects[key].value,
          model: modelSelects[key].value,
          effort: effortSelects[key].value,
        };
        if (maxContextInputs[key]) {
          const maxContext = parseContextSize(maxContextInputs[key].value);
          if (Number.isNaN(maxContext)) {
            return { error: key + " max context must look like 200K, 50K or 1M" };
          }
          values[key].maxContext = maxContext;
        }
      }
      return { nodeSettings: buildNodeSettingsPayload(values) };
    }

    return { el, set, read, setRows, setDefaults, reset: () => set(null),
      open: () => { applyHarnesses(); reloadHarnesses(); },
      dispose: () => harnessListeners.delete(applyHarnesses) };
  }


  const createErr = document.createElement("div");
  createErr.className = "createErr";
  createErr.hidden = true;
  const showCreateError = (message) => {
    createErr.textContent = message || "";
    createErr.hidden = !message;
  };
  const createForm = createPipelineForm("cp", []);
  const pipeLabel = document.createElement("label");
  pipeLabel.textContent = "Pipeline";
  pipeLabel.setAttribute("for", "cp-pipeline");
  const pipelinePicker = document.createElement("select");
  pipelinePicker.id = "cp-pipeline";
  pipelinePicker.setAttribute("aria-label", "pipeline");
  const pipeNote = document.createElement("div");
  pipeNote.className = "pipeNote";
  pipeNote.id = "cp-pipeline-note";
  createPanel.append(pipeLabel, pipelinePicker, pipeNote, createForm.el);

  const saveRow = document.createElement("div");
  saveRow.className = "saveRow";
  saveRow.hidden = true;
  const saveName = document.createElement("input");
  saveName.id = "cp-save-name";
  saveName.placeholder = "new pipeline name";
  saveName.setAttribute("aria-label", "new pipeline name");
  const saveOk = document.createElement("button");
  saveOk.type = "button";
  saveOk.id = "cp-save-ok";
  saveOk.textContent = "Save";
  const saveCancel = document.createElement("button");
  saveCancel.type = "button";
  saveCancel.className = "secondary";
  saveCancel.textContent = "Cancel";
  saveRow.append(saveName, saveOk, saveCancel);

  const cpBtns = document.createElement("div");
  cpBtns.className = "row";
  cpBtns.style.borderTop = "0";
  cpBtns.style.padding = "10px 0 0";
  const cpCreate = document.createElement("button");
  cpCreate.textContent = "Create line";
  const cpSaveAs = document.createElement("button");
  cpSaveAs.type = "button";
  cpSaveAs.id = "cp-save-as";
  cpSaveAs.className = "secondary";
  cpSaveAs.textContent = "Save as pipeline";
  const cpCancel = document.createElement("button");
  cpCancel.textContent = "Cancel";
  cpCancel.style.background = "#262b33";
  cpBtns.append(cpCreate, cpSaveAs, cpCancel);
  createPanel.append(saveRow, createErr, cpBtns);
  linesMain.insertBefore(createPanel, linesMain.firstChild);

  // The pipeline picked in the create panel: its resolved definition, or the
  // errors that stop it from being used. Create and Save are off until loaded.
  let pickedResolved = null;
  let pickedLoaded = false;
  let pickSeq = 0;
  function syncCreateButtons() {
    cpCreate.disabled = !pickedLoaded;
    cpSaveAs.disabled = !pickedLoaded;
  }
  syncCreateButtons();

  async function loadPickedPipeline() {
    const name = pipelinePicker.value;
    const seq = ++pickSeq;
    pickedLoaded = false;
    pickedResolved = null;
    syncCreateButtons();
    if (!name) return;
    let data = null;
    try {
      const res = await fetch("/api/pipelines/" + encodeURIComponent(name));
      data = await res.json().catch(() => null);
      if (!res.ok) data = { errors: [{ message: (data && data.error) || "HTTP " + res.status }] };
    } catch (err) {
      data = { errors: [{ message: String(err) }] };
    }
    if (seq !== pickSeq) return;
    const errors = (data && data.errors) || [];
    pickedResolved = errors.length ? null : data.resolved;
    createForm.setRows(nodeRowsFromResolved(pickedResolved));
    createForm.setDefaults(errors.length ? null : (data && data.defaultNodeSettings) || null);
    pipeNote.textContent = pickedResolved ? Object.keys(pickedResolved.nodes).length + " nodes" : "";
    if (errors.length) showCreateError("Pipeline '" + name + "' cannot be used: " + pipelineErrorsText(errors));
    else showCreateError(null);
    pickedLoaded = !errors.length && !!pickedResolved;
    syncCreateButtons();
  }

  // Fill the picker from GET /api/pipelines; keep `select` (or the current choice), else default.
  async function loadPipelineList(select) {
    let list = [];
    try {
      const res = await fetch("/api/pipelines");
      if (res.ok) list = pickerPipelines((await res.json()).pipelines);
    } catch {}
    const want = select || pipelinePicker.value || "default";
    pipelinePicker.innerHTML = "";
    for (const p of list) {
      const o = document.createElement("option");
      o.value = p.name;
      o.textContent = pipelineOptionLabel(p);
      pipelinePicker.appendChild(o);
    }
    if (!list.length) {
      const o = document.createElement("option");
      o.value = "";
      o.textContent = "No pipelines available";
      pipelinePicker.appendChild(o);
    }
    const before = pipelinePicker.value;
    pipelinePicker.value = list.some((p) => p.name === want) ? want : (list[0] ? list[0].name : "");
    if (!pickedLoaded || pipelinePicker.value !== before || select) await loadPickedPipeline();
  }
  pipelinePicker.addEventListener("change", loadPickedPipeline);

  function resetCreatePanel() {
    nameInput.value = "";
    repoInput.value = "";
    createForm.reset();
    saveRow.hidden = true;
    saveName.value = "";
    pipelinePicker.value = "default";
    showCreateError(null);
    loadPickedPipeline();
  }

  createBtn.addEventListener("click", () => {
    createPanel.hidden = !createPanel.hidden;
    if (!createPanel.hidden) {
      createForm.open();
      loadPipelineList();
      nameInput.focus();
    }
  });

  cpCancel.addEventListener("click", () => {
    createPanel.hidden = true;
    resetCreatePanel();
  });

  cpSaveAs.addEventListener("click", () => {
    saveRow.hidden = false;
    saveName.focus();
  });
  saveCancel.addEventListener("click", () => {
    saveRow.hidden = true;
    saveName.value = "";
    showCreateError(null);
  });
  saveOk.addEventListener("click", async () => {
    const newName = saveName.value.trim();
    if (!newName) return showCreateError("Type a name for the new pipeline first.");
    const out = createForm.read();
    if (out.error) return showCreateError(out.error);
    const body = { newName };
    if (out.nodeSettings) body.nodeSettings = out.nodeSettings;
    showCreateError(null);
    let res;
    try {
      res = await fetch("/api/pipelines/" + encodeURIComponent(pipelinePicker.value) + "/duplicate", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
    } catch (err) {
      return showCreateError(String(err));
    }
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      return showCreateError(data.error || "Saving the pipeline failed (HTTP " + res.status + ")");
    }
    saveRow.hidden = true;
    saveName.value = "";
    await loadPipelineList(newName);
  });

  cpCreate.addEventListener("click", async () => {
    const out = createForm.read();
    if (out.error) return showCreateError(out.error);
    const body = buildCreateBody({ name: nameInput.value, repoUrl: repoInput.value,
      pipelineName: pipelinePicker.value, nodeSettings: out.nodeSettings });
    showCreateError(null);
    let res;
    try {
      res = await fetch("/api/lines", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    } catch (err) {
      showCreateError(String(err));
      return;
    }
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showCreateError(data.error || "Creation failed (HTTP " + res.status + ")");
      return;
    }
    const { id } = await res.json().catch(() => ({}));
    createPanel.hidden = true;
    resetCreatePanel();
    await refresh();
    if (id) selectLine(id);
  });

  let dashboardStream = null;
  let lastStreamRefresh = 0;
  function openStream() {
    const stream = new EventSource("/api/events");
    dashboardStream = stream;
    stream.addEventListener("dashboard", (e) => {
      let envelope;
      try { envelope = JSON.parse(e.data); } catch { return; }
      if (!envelope || envelope.version !== 1) return;
      if (envelope.type === "snapshot_begin") {
        for (const st of cards.values()) st.historyLoader.clear();
        const present = new Set((envelope.data.lines || []).map((line) => line.id));
        for (const id of [...cards.keys()]) if (!present.has(id)) removeCard(id);
        for (const line of envelope.data.lines || []) if (!cards.has(line.id)) addCard(line);
        return;
      }
      if (envelope.type === "line_created") {
        if (!cards.has(envelope.lineId)) addCard(envelope.data);
        return;
      }
      if (envelope.type === "line_deleted") {
        removeCard(envelope.lineId || envelope.data.id);
        return;
      }
      const st = cards.get(envelope.lineId);
      const handler = st && st.handlers && st.handlers[envelope.type];
      if (handler) handler(envelope.data);
    });
    stream.addEventListener("error", () => {
      // EventSource reconnects automatically; do not present a transport failure as a line error.
    });
  }
  // Reconnect so the server sends fresh state for every line. At most once each 2 seconds.
  function refreshStream() {
    const now = Date.now();
    if (now - lastStreamRefresh < 2000) return;
    lastStreamRefresh = now;
    if (dashboardStream) dashboardStream.close();
    openStream();
  }
  openStream();
  refresh();
  setInterval(pollPlans, 3000);
  setInterval(pollInventory, 3000);
  setInterval(pollEvidence, 3000);
});
</script>
</body>
</html>
