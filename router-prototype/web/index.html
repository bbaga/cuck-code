<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<script defer src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>

  button { padding: 8px 14px; background: #2d6cdf; color: #fff; border: 0;

  #linelist { margin-top: 20px; border-top: 1px solid #262b33; padding-top: 12px; }

  .lineentry:hover { background: #0d1014; }
  .lineentry.selected { background: #182335; outline: 1px solid #2d6cdf; }

  .lineentry .lname { flex: 1; overflow: hidden; text-overflow: ellipsis;

  .lcount { color: #6c7a8c; font-size: .75rem; flex-shrink: 0; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px;

  .dot { width: 10px; height: 10px; border-radius: 50%; margin-left: auto; flex-shrink: 0; }

  .transcript pre { margin: 6px 0 0; color: #8b98a8; }
  .liveLabel { color: #6c7a8c; font-size: .75rem; font-family: system-ui, sans-serif; }
  .row { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #262b33; }
  .row input { flex: 1; min-width: 0; padding: 8px; background: #0d1014; color: inherit;
    border: 1px solid #2c333d; border-radius: 4px; }
  .ctxMeter { align-self: center; font-size: .72rem; color: #6c7a8c; white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  .ctxMeter.near { color: #e5a04b; }
  .transcript .compacted { color: #8fa3bd; border-left: 2px solid #3b5170; padding-left: 8px;

  #createPanel { border: 1px solid #262b33; border-radius: 8px; background: #161a20;

  #createPanel h2 { font-size: .95rem; margin: 0 0 10px; }
  #createPanel label { display: block; font-size: .75rem; color: #8fa3bd; margin: 8px 0 2px; }
  #createPanel input, #createPanel select, .pipePane input, .pipePane select { width: 100%; padding: 6px; background: #0d1014;
    color: inherit; border: 1px solid #2c333d; border-radius: 4px; font-size: .8rem; }
  .phaseRow { display: grid; grid-template-columns: 88px minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) 88px 72px;
    gap: 6px; align-items: center; margin-top: 6px; }
  .phaseRow .phaseName { font-size: .75rem; color: #6c7a8c; }
  .authHint { font-size: .7rem; color: #e5a04b; margin-top: 2px; min-height: 1em;
    grid-column: 2 / -1; }
  .authSummary { font-size: .7rem; color: #e5a04b; margin-top: 10px; white-space: pre-wrap; }
  .createErr { margin-top: 8px; padding: 6px; border-radius: 4px; background: #4d1420;
    color: #ff8095; font-size: .78rem; white-space: pre-wrap; }
  .pipeCfg { padding: 6px 16px; border-bottom: 1px solid #262b33; font-size: .72rem;

  .pipePane { flex: 1; overflow-y: auto; padding: 12px 16px; max-width: 720px; }

  .pipePane .pipeCfg { padding: 0; border: 0; }
  .pipeNote { font-size: .72rem; color: #6c7a8c; margin: 0 0 8px; }
  .presetBar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto auto;
    gap: 6px; align-items: center; margin: 4px 0 8px; }
  .presetBar button, .pipeBtns button { white-space: nowrap; }
  .pipeBtns { display: flex; gap: 8px; margin-top: 10px; }
  button.secondary { background: #262b33; }

  @media (max-width: 640px) { .presetBar { grid-template-columns: 1fr 1fr; } }
  .wcfg { font-size: .62rem; color: #6c7a8c; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #registry { flex: 1; padding: 24px; min-width: 0; }
  .regSummary, .regConn { font-size: .8rem; color: #8fa3bd; }
  .regControls, .regPager, .regTabs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .regTableWrap { overflow-x: auto; }
  #registry table { border-collapse: collapse; font-size: .78rem; width: 100%; }
  #registry th, #registry td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #262b33; }
  #registry th { color: #8fa3bd; }
  .regDetails { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 4px 0; font-size: .78rem; }
  .regDetails dt { color: #8fa3bd; }
  .regDetails dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .regEvents { font-size: .78rem; }
  .regBadge { background: #4d3a14; color: #ffc46b; border-radius: 3px; padding: 0 4px; }
  .regError { padding: 6px; border-radius: 4px; background: #4d1420; color: #ff8095; font-size: .8rem; }
  #registry input, #registry select { padding: 6px; background: #0d1014; color: inherit; border: 1px solid #2c333d; border-radius: 4px; }
  @media (max-width: 640px) {
    body { flex-direction: column; }
    #sidebar { width: auto; box-sizing: border-box; border-right: 0; border-bottom: 1px solid #262b33; }
    #registry { padding: 12px; }

    .phaseRow .phaseName { grid-column: 1 / -1; }
    .authHint { grid-column: 1 / -1; }

</style>
</head>
<body>
<aside id="sidebar">
  <h1><img src="/favicon.svg" alt="">cuck-code</h1>
  <button id="create">+ Create new line</button>
  <button id="registryBtn" aria-pressed="false">Registry</button>
  <div id="linelist"></div>
</aside>
<main id="lines">
  <div id="empty">Select or create a production line.</div>
</main>
<section id="registry" hidden aria-label="Registry"></section>
<script src="pipeline-ui.js"></script>
<script src="registry-ui-extra.js"></script>
<script src="registry-ui.js"></script>
<script src="registry-line.js"></script>
<script>
window.addEventListener("DOMContentLoaded", () => {
  const { PHASE_ROWS, EFFORT_LEVELS, CONTEXT_PHASES, parseContextSize, formatTokens, filterInstalled, buildPipelinePayload, authBadge, previewForIntegration,
    previewSelectionKey, previewSelectionExists, isPassingIntegration, mapPreviewPayload, fetchLinePreview, sanitizePreviewCommand,
    PI_HARNESS_ID, VIBE_HARNESS_ID, authModeOptions, modelOptionsForPhase, piDetailUrl,
    authModeSelectState, piDetailApply, createRequestTracker, fetchPiDetail,
    clearHarnessState, clearProviderState, shouldHideValidator,
    shouldShowIntegrationValidator, buildGraphLanes,
    selectEvidenceAttempt, clampEvidenceStep, renderEvidenceFromState,
    evidencePollIsCurrent } = window.pipelineUI;
  const cards = new Map();
  const linesEl = document.getElementById("lines");
  const listEl = document.getElementById("linelist");
  let selectedLine = null;
  const SVGNS = "http://www.w3.org/2000/svg";

  mermaid.initialize({ startOnLoad: false, theme: "dark" });

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  marked.use({ renderer: { code(codeOrToken, infostring) {
    const text = typeof codeOrToken === "object" ? codeOrToken.text : codeOrToken;
    const lang = ((typeof codeOrToken === "object" ? codeOrToken.lang : infostring) || "").trim();
    if (lang === "mermaid") return '<div class="mermaid">' + text + "</div>";
    return "<pre><code>" + escapeHtml(text) + "</code></pre>";
  } } });

  function textOf(entry) {
    const c = entry.content;
    if (typeof c === "string") return c;
    if (Array.isArray(c)) return c.filter(p => p && p.type === "text").map(p => p.text).join("");
    if (typeof entry.text === "string") return entry.text;
    return "";
  }

  function entryEl(entry) {
    const div = document.createElement("div");
    const stamp = () => {
      if (typeof entry.at !== "number") return;
      const s = document.createElement("span");
      s.className = "ts";
      s.textContent = new Date(entry.at).toLocaleTimeString([], { hour12: false });
      div.appendChild(s);
    };
    const details = (label, body) => {
      const d = document.createElement("details");
      const s = document.createElement("summary");
      s.textContent = label;
      const pre = document.createElement("pre");
      pre.textContent = body;
      d.append(s, pre);
      div.appendChild(d);
    };
    if (entry && entry.type === "message" && entry.role === "user") {
      div.className = "user";
      stamp();
      div.appendChild(document.createTextNode("> " + textOf(entry)));
    } else if (entry && entry.type === "message" && entry.role === "assistant") {
      div.className = "assistant";
      stamp();
      div.appendChild(document.createTextNode(textOf(entry)));
    } else if (entry && entry.type === "message" && entry.role === "system") {
      div.className = "compacted";
      stamp();
      div.appendChild(document.createTextNode(textOf(entry)));
    } else if (entry && entry.type === "reasoning") {
      stamp();
      details("thinking", textOf(entry));
    } else {
      stamp();
      details((entry && entry.type) || "unknown", JSON.stringify(entry, null, 2));
    }
    return div;
  }

  async function renderPlan(st, content) {
    st.planBody.innerHTML = marked.parse(content);
    for (const node of st.planBody.querySelectorAll("div.mermaid")) {
      try { await mermaid.run({ nodes: [node] }); }
      catch {
        const pre = document.createElement("pre");
        pre.textContent = node.textContent;
        node.replaceWith(pre);
      }
    }
  }

  function updateControls(st) {
    st.approveBtn.hidden = st.approved;
    st.badge.hidden = !st.approved;
    if (st.approved && st.planBody.parentNode !== st.planDetails) {
      st.planDetails.appendChild(st.planBody);
      st.planDetails.hidden = false;
      st.plan.hidden = true;
    } else if (!st.approved && st.planBody.parentNode === st.planDetails) {
      st.plan.insertBefore(st.planBody, st.planControls);
      st.planDetails.hidden = true;
      st.plan.hidden = false;
    }
    if (st.started && st.planContent && !st.approved) {
      st.input.placeholder = "Plan proposed - type feedback here";
    } else if (st.started) {
      st.input.placeholder = "Send a prompt";
    }
  }

  function workerNode(st, w, x, y, width, withEdges) {
    const validator = (w.role || "implementor") === "validator";
    const n = document.createElement("div");
    n.className = "gnode worker w-" + w.status + (validator ? " w-validator" : "")
      + (w.verdict === "fail" ? " w-issue" : "")
      + (st.selected === w.id ? " sel" : "");
    n.style.left = x + "px";
    n.style.top = y + "px";
    n.style.width = width + "px";
    const nm = document.createElement("span");
    nm.textContent = w.name;
    nm.style.overflow = "hidden";
    nm.style.textOverflow = "ellipsis";
    nm.style.whiteSpace = "nowrap";
    const tag = document.createElement("span");
    tag.className = "persona-chip p-" + (w.persona || "backend");
    tag.textContent = validator ? "val" : (w.persona || "backend");
    n.append(tag, nm);
    const cfg = [w.harness, w.model, w.effort].filter(Boolean).join(" · ");
    if (cfg) {
      const cfgEl = document.createElement("span");
      cfgEl.className = "wcfg";
      cfgEl.textContent = cfg;
      cfgEl.title = cfg;
      n.appendChild(cfgEl);
    }
    const d = document.createElement("span");
    d.className = "dot " + w.status;
    n.append(d);
    if (w.status === "running") {
      const stop = document.createElement("button");
      stop.className = "stopBtn";
      stop.textContent = "Stop";
      stop.addEventListener("click", async (e) => {
        e.stopPropagation();
        await fetch("/api/protocol/workers/" + w.id + "/stop", { method: "POST" });
      });
      n.appendChild(stop);
    }
    if (w.lastError) n.title = w.lastError;
    n.addEventListener("click", () => selectNode(st, w.id));
    return n;
  }

  function renderGraph(st) {
    const graph = st.graph;
    const top = graph.scrollTop, left = graph.scrollLeft;
    try { renderGraphContents(st); } finally { graph.scrollTop = top; graph.scrollLeft = left; }
  }

  function renderGraphContents(st) {
    const layout = pipelineUI.buildGraphLanes([...st.workers.values()], !!st.hideFailedValidators);
    const lanes = layout.lanes;
    const impls = lanes.map((lane) => lane.worker);
    const vals = [...lanes.flatMap((lane) => lane.validators), ...layout.orphans];
    const ints = layout.integrations;
    const rows = Math.max(layout.totalRows, 1);
    const h = Math.max(140, 14 + (rows - 1) * 46 + 36 + 14);
    const graph = st.graph;
    graph.innerHTML = "";
    const selectedPreviewWorker = st.selected && st.selected.startsWith("preview:")
      ? st.workers.get(st.selected.slice("preview:".length)) : null;
    if (selectedPreviewWorker && st.previewPanel.hidden) {
      const currentPreview = mapPreviewPayload(st.previewPayload, selectedPreviewWorker);
      if (currentPreview) renderPreviewPanel(st, selectedPreviewWorker, currentPreview);
    }
    const W = graph.clientWidth || 440;
    const plannerW = 92, plannerX = 12;
    const nodeW = 190;
    const implX = plannerX + plannerW + 46;
    const valX = implX + nodeW + 46;
    const intX = valX + nodeW + 46;
    const innerW = Math.max(W, intX + nodeW + 12);
    const inner = document.createElement("div");
    inner.style.position = "relative";
    inner.style.height = h + "px";
    inner.style.width = innerW + "px";
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("width", innerW);
    svg.setAttribute("height", h);
    inner.appendChild(svg);
    graph.appendChild(inner);
    const plannerY = Math.round(h / 2 - 18);
    const implY = (i) => 14 + lanes[i].startRow * 46;
    const validatorY = new Map();
    lanes.forEach((lane) => lane.validators.forEach((v, i) => validatorY.set(v.id, 14 + (lane.startRow + i) * 46)));
    layout.orphans.forEach((v, i) => validatorY.set(v.id, 14 + (layout.orphanStartRow + i) * 46));
    const integrationY = (i) => 14 + (layout.integrationStartRow + i) * 46;

    const pn = document.createElement("div");
    pn.className = "gnode planner" + (st.selected === null ? " sel" : "");
    pn.style.left = plannerX + "px";
    pn.style.top = plannerY + "px";
    pn.style.width = plannerW + "px";
    const pnLabel = document.createElement("span");
    pnLabel.textContent = "planner";
    const pd = document.createElement("span");
    pd.className = "dot " + (st.plannerStatus === "running" ? "running" : "idle");
    pn.append(pnLabel, pd);
    pn.addEventListener("click", () => selectNode(st, null));
    inner.appendChild(pn);

    const edge = (x1, y1, x2, y2) => {
      const path = document.createElementNS(SVGNS, "path");
      const mid = x1 + 20;
      path.setAttribute("d", `M ${x1} ${y1} H ${mid} V ${y2} H ${x2}`);
      path.setAttribute("class", "edge");
      svg.appendChild(path);
    };

    impls.forEach((w, i) => {
      edge(plannerX + plannerW, plannerY + 18, implX, implY(i) + 18);
      inner.appendChild(workerNode(st, w, implX, implY(i), nodeW));
    });

    vals.forEach((v) => {
      const y = validatorY.get(v.id);
      const sourceIndex = lanes.findIndex((lane) => lane.worker.id === v.validates);
      const source = sourceIndex >= 0 ? lanes[sourceIndex] : null;
      if (source && source.validators[0] === v) {
        edge(implX + nodeW, y + 18, valX, y + 18);
      } else if (source) {
        const startY = implY(sourceIndex) + 18;
        const gutterX = implX + nodeW + 22;
        const path = document.createElementNS(SVGNS, "path");
        path.setAttribute("d", `M ${implX + nodeW} ${startY} H ${gutterX} V ${y + 18} H ${valX}`);
        path.setAttribute("class", "edge");
        svg.appendChild(path);
      } else {
        edge(plannerX + plannerW, plannerY + 18, valX, y + 18);
      }
      inner.appendChild(workerNode(st, v, valX, y, nodeW));
    });

    ints.forEach((iv, j) => {
      const y = integrationY(j);
      edge(plannerX + plannerW, plannerY + 18, intX, y + 18);
      inner.appendChild(workerNode(st, iv, intX, y, nodeW));
      const data = mapPreviewPayload(st.previewPayload, iv);
      if (st.selected === previewSelectionKey(iv.id) && data && st.previewPanel.hidden) renderPreviewPanel(st, iv, data);
      if (data) {
        const px = intX + nodeW + 46, py = y;
        edge(intX + nodeW, py + 18, px, py + 18);
        const node = document.createElement("button");
        node.className = "gnode" + (st.selected === previewSelectionKey(iv.id) ? " sel" : "");
        node.textContent = "Preview";
        node.style.left = px + "px"; node.style.top = py + "px"; node.style.width = "110px";
        node.addEventListener("click", () => selectPreview(st, iv, data));
        inner.appendChild(node);
      }
    });
  }

  function selectPreview(st, worker, data) {
    st.selected = previewSelectionKey(worker.id);
    try { localStorage.setItem("preview-selection:" + st.id, st.selected); } catch {}
    renderPreviewPanel(st, worker, data);
  }

  function renderPreviewPanel(st, worker, data) {
    const panel = document.createElement("section");
    panel.setAttribute("aria-label", "Preview instructions");
    const title = document.createElement("h2"); title.textContent = "Preview instructions (read only)"; panel.appendChild(title);
    const add = (label, value) => { if (!value) return; const p = document.createElement("p"); p.textContent = label + ": " + value; panel.appendChild(p); };
    add("Revision", data.sourceRevision); add("Project directory", data.projectDirectory); add("Expected URL", data.expectedUrl);
    add("Prerequisites", Array.isArray(data.prerequisites) ? data.prerequisites.join("; ") : "");
    add("Limitations", Array.isArray(data.limitations) ? data.limitations.join("; ") : "");
    add("Explanation", data.message || data.reason || "");
    if (data.stale === true) add("Data status", "Stale. Do not rely on these instructions.");
    if (data.availability === "unavailable") add("Data status", data.message || "Preview data is unavailable.");
    if (data.eligible !== true) add("Data status", "Not eligible for use. Preview instructions require a completed passing integration.");
    if (data.availability !== "available") add("Availability", data.reason || data.message || data.availability || "Unavailable");
    if (data.eligible !== true && data.steps.length === 0) add("Instructions", "No usable preview steps are available.");
    if (data.eligible === true) data.steps.forEach((step, i) => { const box = document.createElement("div"); box.className = "previewStep";
      const label = document.createElement("h3"); label.textContent = (i + 1) + ". " + (step.description || step.title || "Instruction");
      box.appendChild(label);
      const command = step && typeof step === "object" && typeof step.command === "string"
        ? sanitizePreviewCommand(step.command) : "";
      const pre = document.createElement("pre"); pre.textContent = command || (typeof step === "string" ? step : step.text || "");
      box.appendChild(pre);
      if (command) { const copy = document.createElement("button"); copy.type = "button"; copy.textContent = "Copy command";
        copy.addEventListener("click", () => navigator.clipboard.writeText(command)); box.appendChild(copy); }
      panel.appendChild(box); });
    st.previewPanel.replaceChildren(panel); st.previewPanel.hidden = false; renderGraph(st);
  }

  function selectNode(st, id) {
    if (st.previewPanel) st.previewPanel.hidden = true;
    if (st.selected !== id) st.followTranscript = true;
    st.selected = id;
    try { localStorage.removeItem("preview-selection:" + st.id); } catch {}
    const w = id !== null ? st.workers.get(id) : null;
    const isValidator = w && (w.role || "implementor") === "validator";
    if (st.tabEvBtn) st.tabEvBtn.hidden = !isValidator;
    renderGraph(st);
    renderTranscript(st);
    renderContextControls(st);
  }

  // Context meter and Compact button for the selected session: the planner
  // or an implementor. Validators and preview nodes have no session to
  // compact.
  function renderContextControls(st) {
    if (!st.ctxMeter) return;
    const target = st.selected === null ? st.plannerCtx
      : (typeof st.selected === "string" && !st.selected.startsWith("preview:")
        ? st.workers.get(st.selected) : null);
    const ctx = target && target.context;
    st.ctxMeter.hidden = st.compactBtn.hidden = !ctx;
    if (!ctx) return;
    const limit = ctx.threshold ? " / " + formatTokens(ctx.threshold) : "";
    st.ctxMeter.textContent = (ctx.estimated ? "~" : "") + formatTokens(ctx.tokens) + limit + " ctx";
    st.ctxMeter.classList.toggle("near", !!ctx.threshold && ctx.tokens >= ctx.threshold * 0.8);
    st.ctxMeter.title = (ctx.estimated
      ? "Estimated from prompt and reply text; tool output is not counted. "
      : "Reported by the harness. ")
      + ctx.turns + " turn(s) on this session, " + ctx.compactions + " compaction(s)."
      + (ctx.threshold ? " Compacts automatically at " + formatTokens(ctx.threshold) + "." : "");
    const running = st.selected === null ? st.plannerStatus === "running" : target.status === "running";
    st.compactBtn.textContent = target.compacting ? "Compacting…" : "Compact";
    st.compactBtn.disabled = !!target.compacting || !target.hasSession || running;
    st.compactBtn.title = target.compacted && !target.hasSession
      ? "Compacted; the next run starts a fresh session with the summary."
      : "Summarize this session and continue in a fresh one.";
  }

  function syncTranscriptScroll(st) {
    // Hidden lines/tabs have no scroll geometry; retain their follow state.
    if (!st.transcript.clientHeight) return;
    if (st.followTranscript) st.transcript.scrollTop = st.transcript.scrollHeight;
    st.scrollBottomBtn.hidden = st.followTranscript;
  }

  function setupTranscriptScroll(st) {
    st.followTranscript = true;
    st.transcript.addEventListener("scroll", () => {
      if (!st.transcript.clientHeight) return;
      const { scrollHeight, scrollTop, clientHeight } = st.transcript;
      st.followTranscript = scrollHeight - scrollTop - clientHeight <= 4;
      st.scrollBottomBtn.hidden = st.followTranscript;
    });
    st.scrollBottomBtn.addEventListener("click", () => {
      st.followTranscript = true;
      syncTranscriptScroll(st);
    });
    // Keep following when the viewport or surrounding panels change size.
    st.transcriptResizeObserver = new ResizeObserver(() => syncTranscriptScroll(st));
    st.transcriptResizeObserver.observe(st.transcript);
  }

  function appendEntry(st, el) {
    st.transcript.appendChild(el);
    syncTranscriptScroll(st);
  }

  function renderTranscript(st) {
    const scrollTop = st.transcript.scrollTop;
    st.transcript.innerHTML = "";
    if (st.selected === null) {
      for (const e of st.plannerTranscript) st.transcript.appendChild(entryEl(e));
    } else {
      const w = st.workers.get(st.selected);
      const label = document.createElement("div");
      label.className = "liveLabel";
      label.textContent = "worker '" + (w ? w.name : st.selected)
        + "' - live view (since page load)";
      st.transcript.appendChild(label);
      for (const e of st.workerTranscripts.get(st.selected) || []) {
        st.transcript.appendChild(entryEl(e));
      }
      if (w && w.lastError) {
        const err = document.createElement("div");
        err.className = "runError";
        err.textContent = w.lastError;
        st.transcript.appendChild(err);
      }
    }
    if (!st.followTranscript) st.transcript.scrollTop = scrollTop;
    syncTranscriptScroll(st);
  }

  function addCard(line) {
    const card = document.createElement("div");
    card.className = "card";
    const head = document.createElement("div");
    head.className = "head";
    const name = document.createElement("span");
    name.textContent = line.name;
    const dot = document.createElement("span");
    dot.className = "dot";
    const tabLineBtn = document.createElement("button");
    tabLineBtn.className = "tabBtn active";
    tabLineBtn.textContent = "Line";
    tabLineBtn.style.marginLeft = "auto";
    const tabProcBtn = document.createElement("button");
    tabProcBtn.className = "tabBtn";
    tabProcBtn.textContent = "Processes";
    const tabWorkBtn = document.createElement("button");
    tabWorkBtn.className = "tabBtn";
    tabWorkBtn.textContent = "Work";
    const tabEvBtn = document.createElement("button");

    const delBtn = document.createElement("button");

          delBtn.classList.remove("armed");
          delBtn.textContent = "Delete";
        }, 4000);
        return;
      }
      clearTimeout(disarmTimer);
      await fetch("/api/lines/" + line.id, { method: "DELETE" });
      removeCard(line.id);
    });
    head.append(name, dot, tabLineBtn, tabProcBtn, tabEvBtn, tabWorkBtn, hideFailedToggle, delBtn);
    const tabPipeBtn = document.createElement("button");
    tabPipeBtn.className = "tabBtn";
    tabPipeBtn.textContent = "Pipeline";
    head.insertBefore(tabPipeBtn, hideFailedToggle);
    // Pipeline page: the effective settings, and a form to change the
    // line's own settings at any time.
    const pipePane = document.createElement("div");
    pipePane.className = "pipePane";
    pipePane.hidden = true;
    const pipeEffective = document.createElement("div");
    pipeEffective.className = "pipeCfg";
    const pipeEditTitle = document.createElement("h3");
    pipeEditTitle.textContent = "Change settings";
    const pipeNote = document.createElement("p");
    pipeNote.className = "pipeNote";
    pipeNote.textContent = "Changes apply from the next run. Running sessions finish with their current settings. "
      + "Existing workers keep the harness, model and effort they were spawned with; new workers use the new settings. "
      + "A planner harness change compacts the planner session on the old harness and continues in a fresh one.";
    const pipeMsg = document.createElement("div");
    pipeMsg.className = "createErr";
    pipeMsg.hidden = true;
    const showPipeMsg = (message, ok) => {
      pipeMsg.textContent = message || "";
      pipeMsg.hidden = !message;
      pipeMsg.classList.toggle("ok", !!ok);
    };
    const pipeForm = createPipelineForm("lp-" + line.id);
    const pipePresets = createPresetBar(pipeForm, showPipeMsg);
    const pipeBtns = document.createElement("div");
    pipeBtns.className = "pipeBtns";
    const pipeSave = document.createElement("button");
    pipeSave.textContent = "Save settings";
    const pipeRevert = document.createElement("button");
    pipeRevert.className = "secondary";
    pipeRevert.textContent = "Revert";
    pipeBtns.append(pipeSave, pipeRevert);
    pipePane.append(pipeEffective, pipeEditTitle, pipeNote, pipePresets.el, pipeForm.el, pipeMsg, pipeBtns);
    const planDetails = document.createElement("details");
    planDetails.className = "planDetails";
    planDetails.hidden = true;
    const planSummary = document.createElement("summary");
    planSummary.textContent = "Plan";
    planDetails.appendChild(planSummary);
    const banner = document.createElement("div");
    banner.className = "banner";
    banner.hidden = true;
    banner.title = "Click to dismiss";
    banner.addEventListener("click", () => { banner.hidden = true; });

    const plan = document.createElement("div");
    plan.className = "plan";
    const waiting = document.createElement("div");
    waiting.className = "waiting";
    waiting.textContent = "waiting for plan.md ...";
    const planBody = document.createElement("div");
    planBody.className = "planBody";
    const controls = document.createElement("div");
    controls.className = "controls";
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = "approved";
    badge.hidden = true;
    const approveBtn = document.createElement("button");
    approveBtn.textContent = "Approve";
    controls.append(badge, approveBtn);
    plan.append(waiting, planBody, controls);

    const graph = document.createElement("div");
    graph.className = "graph";
    const previewPanel = document.createElement("div"); previewPanel.className = "previewPanel"; previewPanel.hidden = true;

    const transcript = document.createElement("div");
    transcript.className = "transcript";
    const transcriptWrap = document.createElement("div");
    transcriptWrap.className = "transcriptWrap";
    const scrollBottomBtn = document.createElement("button");
    scrollBottomBtn.className = "scrollBottomBtn";
    scrollBottomBtn.type = "button";
    scrollBottomBtn.textContent = "↓ Scroll to bottom";
    scrollBottomBtn.hidden = true;
    transcriptWrap.append(transcript, scrollBottomBtn);
    const row = document.createElement("div");
    row.className = "row";
    const input = document.createElement("input");
    input.placeholder = "Send a prompt";
    const send = document.createElement("button");
    send.textContent = "Send";
    const ctxMeter = document.createElement("span");
    ctxMeter.className = "ctxMeter";
    ctxMeter.hidden = true;
    const compactBtn = document.createElement("button");
    compactBtn.textContent = "Compact";
    compactBtn.hidden = true;
    row.append(input, send, ctxMeter, compactBtn);
    const procPane = document.createElement("div");
    procPane.className = "procPane";
    procPane.hidden = true;
    const evPane = document.createElement("div");
    evPane.className = "evPane";
    evPane.hidden = true;
    const workPane = document.createElement("div");
    workPane.className = "evPane workPane";
    workPane.hidden = true;
    card.append(head, planDetails, banner, plan, graph, previewPanel, transcriptWrap, row, procPane, evPane, workPane, pipePane);
    linesEl.appendChild(card);

    const st = { id: line.id, dot, banner, transcript, transcriptWrap, scrollBottomBtn, input, send,
      ctxMeter, compactBtn, plannerCtx: null,
      waiting, planBody, graph, previewPanel, approveBtn, badge, planDetails, planControls: controls,
      pipePane, tabPipeBtn, pipeForm, pipePresets, pipeEffective,
      pipeline: line.pipeline || null, pipelineOverrides: line.pipelineOverrides || null,
      tab: "line", tabLineBtn, tabProcBtn, tabEvBtn, tabWorkBtn, workPane, plan, row, procPane, evPane,
      hideFailedValidators: true,
      plannerStatus: line.status, started: line.started === true,
      planContent: undefined, approved: false,
      workers: new Map(), workerTranscripts: new Map(), previewPayload: null, previewRequest: 0,

      plannerTranscript: [], selected: null };
    setupTranscriptScroll(st);

    tabLineBtn.addEventListener("click", () => setLineTab(st, "line"));
    tabProcBtn.addEventListener("click", () => setLineTab(st, "processes"));
    tabEvBtn.addEventListener("click", () => setLineTab(st, "evidence"));
    tabPipeBtn.addEventListener("click", () => setLineTab(st, "pipeline"));
    renderPipelineSummary(st);
    pipeForm.set(st.pipelineOverrides);
    pipeRevert.addEventListener("click", () => { pipeForm.set(st.pipelineOverrides); pipePresets.reset(); showPipeMsg(null); });
    pipeSave.addEventListener("click", async () => {
      const out = pipeForm.read();
      if (out.error) return showPipeMsg(out.error);
      pipeSave.disabled = true;
      const res = await fetch("/api/lines/" + st.id + "/pipeline", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pipeline: out.pipeline }),
      }).catch(() => null);
      pipeSave.disabled = false;
      const data = res ? await res.json().catch(() => ({})) : {};
      if (!res || !res.ok) return showPipeMsg(data.error || "Saving the settings failed.");
      st.pipeline = data.pipeline;
      st.pipelineOverrides = data.overrides;
      renderPipelineSummary(st);
      pipeForm.set(st.pipelineOverrides);
      showPipeMsg("Saved. The settings apply from the next run.", true);
    });
    tabWorkBtn.addEventListener("click", () => setLineTab(st, "work"));
    hideFailedCheckbox.addEventListener("change", () => {
      st.hideFailedValidators = hideFailedCheckbox.checked;
      renderGraph(st);
    });

    const setStatus = (status) => {
      st.plannerStatus = status;
      dot.className = "dot " + (status === "running" ? "running"
        : status === "standby" ? "standby" : "idle");
      input.disabled = send.disabled = status === "running";
      if (st.started) {
        input.placeholder = (st.planContent && !st.approved)
          ? "Plan proposed - type feedback here" : "Send a prompt";
      } else {
        input.placeholder = "Type the initial prompt and press Enter";
      }
      renderGraph(st);
      updateListEntry(st);
      renderContextControls(st);
    };
    const showError = (message) => {
      banner.textContent = message;
      banner.hidden = false;
    };

    compactBtn.addEventListener("click", async () => {
      const workerId = st.selected;
      const url = workerId === null ? "/api/lines/" + st.id + "/compact"
        : "/api/protocol/workers/" + workerId + "/compact";
      compactBtn.disabled = true;
      const res = await fetch(url, { method: "POST" }).catch(() => null);
      if (!res || !res.ok) {
        const data = res ? await res.json().catch(() => ({})) : {};
        showError("Compaction did not start. " + (data.error || "Request failed."));
        renderContextControls(st);
      }
    });

    approveBtn.addEventListener("click", async () => {
      await fetch("/api/lines/" + st.id + "/approve", { method: "POST" });
      st.approved = true;
      updateControls(st);
    });

    try {
      const savedPreview = localStorage.getItem("preview-selection:" + st.id);
      if (savedPreview && savedPreview.startsWith("preview:")) st.selected = savedPreview;
    } catch {}

    const refreshPreview = async () => {
      const request = ++st.previewRequest;
      const result = await fetchLinePreview({ lineId: st.id, fetchImpl: fetch,
        isCurrent: () => request === st.previewRequest && cards.get(st.id) === st });
      if (request !== st.previewRequest || cards.get(st.id) !== st) return;
      st.previewPayload = result.ok ? result.payload : {
        availability: "unavailable", eligible: false, stale: false, steps: [], message: result.message,
      };
      if (st.selected && st.selected.startsWith("preview:")) {
        const worker = st.workers.get(st.selected.slice("preview:".length));
        const data = mapPreviewPayload(st.previewPayload, worker);
        if (worker) renderPreviewPanel(st, worker, data || st.previewPayload);
      }
      renderGraph(st);
    };
    refreshPreview();

    st.handlers = {
      state(state) {
        st.plannerTranscript = state.transcript || [];
        st.approved = !!state.planApproved;
        st.plannerCtx = state.context ? { context: state.context, compacting: !!state.compacting,
          hasSession: !!state.hasSession, compacted: !!state.compacted } : null;
        if (state.started === true) st.started = true;
        updateControls(st);
        st.workers = new Map((state.workers || []).map((w) => [w.id, w]));
        if (st.selected === null) {
          try {
            const savedPreview = localStorage.getItem("preview-selection:" + st.id);
            if (previewSelectionExists(state.workers || [], savedPreview)) st.selected = savedPreview;
          } catch {}
        }
        for (const w of state.workers || []) {
          if (!st.workerTranscripts.has(w.id)) st.workerTranscripts.set(w.id, []);
        }
        if (typeof st.selected === "string" && st.selected.startsWith("preview:")) {
          if (!previewSelectionExists(state.workers || [], st.selected)) st.selected = null;
          else {
            const selectedPreviewId = st.selected.slice("preview:".length);
            const selectedWorker = (state.workers || []).find((worker) => String(worker.id) === selectedPreviewId);
            const currentData = selectedWorker && mapPreviewPayload(st.previewPayload, selectedWorker);
            if (currentData) renderPreviewPanel(st, selectedWorker, currentData);
          }
        } else if (st.selected !== null && !st.workers.has(st.selected)) st.selected = null;
        setStatus(state.status);
        refreshPreview();
        renderTranscript(st);
      },
      status(data) { setStatus(data.status); },
      entry(entry) {
        st.plannerTranscript.push(entry);
        if (st.selected === null) appendEntry(st, entryEl(entry));
      },
      worker_entry({ workerId, entry }) {
        if (!st.workerTranscripts.has(workerId)) {
          st.workerTranscripts.set(workerId, []);
          if (!st.workers.has(workerId)) st.workers.set(workerId, { id: workerId, name: workerId,
            status: "running", branch: "", role: "implementor", kind: "standard" });
        }
        st.workerTranscripts.get(workerId).push(entry);
        if (st.selected === workerId) appendEntry(st, entryEl(entry));
      },
      worker_spawned({ worker }) {
        st.workers.set(worker.id, worker);
        if (!st.workerTranscripts.has(worker.id)) st.workerTranscripts.set(worker.id, []);
        renderGraph(st); updateListEntry(st); refreshPreview();
      },
      worker_status({ workerId, status, verdict, error }) {
        const w = st.workers.get(workerId);
        if (w) {
          w.status = status;
          if (verdict) w.verdict = verdict;
          w.lastError = error || null;
          if (error) showError("Worker '" + w.name + "' failed. " + error);
          if (st.selected === workerId) renderTranscript(st);
        }
        renderGraph(st); updateListEntry(st); refreshPreview(); renderContextControls(st);
      },
      worker_removed({ workerIds }) {
        for (const id of workerIds || []) {
          st.workers.delete(id);
          st.workerTranscripts.delete(id);
        }
        if (st.selected !== null && !st.workers.has(st.selected)) selectNode(st, null);
        renderGraph(st); updateListEntry(st);
      },
      line_error({ message }) { if (message) showError(message); },
      pipeline({ pipeline, overrides }) {
        const changed = JSON.stringify(overrides || null) !== JSON.stringify(st.pipelineOverrides || null);
        st.pipeline = pipeline;
        st.pipelineOverrides = overrides || null;
        renderPipelineSummary(st);
        // Another tab or the API changed the settings: show them, unless
        // this page is open with possibly unsaved edits.
        if (changed && st.tab !== "pipeline") st.pipeForm.set(st.pipelineOverrides);
      },
      context({ target, ...fields }) {
        if (target === "planner") st.plannerCtx = fields;
        else {
          const w = st.workers.get(target);
          if (w) Object.assign(w, fields);
        }
        renderContextControls(st);
      },
    };

    const post = async () => {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      if (!st.started) {
        st.started = true;
        input.placeholder = "Send a prompt";
      }
      await fetch("/api/lines/" + st.id + "/prompts", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
    };
    send.addEventListener("click", post);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") post(); });

    setStatus(line.status);
    renderGraph(st);
    updateControls(st);

    const entryDot = document.createElement("span");
    entryDot.className = "dot";
    const entryName = document.createElement("span");
    entryName.className = "lname";
    entryName.textContent = line.name;
    const entryCount = document.createElement("span");
    entryCount.className = "lcount";
    const entry = document.createElement("div");
    entry.className = "lineentry";
    entry.append(entryDot, entryName, entryCount);
    entry.addEventListener("click", () => selectLine(st.id));
    listEl.appendChild(entry);
    st.card = card;
    st.entry = entry;
    st.entryDot = entryDot;
    st.entryCount = entryCount;
    card.style.display = "none";
    cards.set(line.id, st);
    updateListEntry(st);
    if (selectedLine === null) selectLine(line.id);
  }

  function removeCard(id) {
    const st = cards.get(id);
    if (st) {
      st.transcriptResizeObserver.disconnect();
      st.pipeForm.dispose();
      st.pipePresets.dispose();
      st.card.remove();
      st.entry.remove();
      cards.delete(id);
    }
    if (selectedLine === id) {
      const next = cards.keys().next();
      selectLine(next.done ? null : next.value);
    }
  }

  function updateListEntry(st) {
    if (!st.entry) return;
    const anyRunning = st.plannerStatus === "running"
      || [...st.workers.values()].some((w) => w.status === "running");
    st.entryDot.className = "dot " + (anyRunning ? "running"
      : st.plannerStatus === "standby" ? "standby" : "idle");
    st.entryCount.textContent = st.workers.size ? st.workers.size + "w" : "";
  }

  // Effective settings of a line: the line's own settings merged over the
  // router defaults, one row per phase.
  function renderPipelineSummary(st) {
    const box = st.pipeEffective;
    box.innerHTML = "";
    const title = document.createElement("h3");
    title.textContent = "Effective settings";
    box.appendChild(title);
    const p = st.pipeline && typeof st.pipeline === "object" ? st.pipeline : {};
    const own = st.pipelineOverrides || {};
    for (const { key } of PHASE_ROWS) {
      const cfg = p[key];
      if (!cfg || typeof cfg !== "object") continue;
      const parts = [cfg.harness, cfg.model || "default model", cfg.effort].filter(Boolean);
      if (cfg.timeLimit) parts.push(cfg.timeLimit + "s");
      if (cfg.maxContext !== undefined) {
        parts.push(cfg.maxContext ? "compact at " + formatTokens(cfg.maxContext) : "no auto compaction");
      }
      const row = document.createElement("div");
      row.className = "pipeRow";
      row.textContent = key + ": " + parts.join(" · ")
        + (own[key] && Object.keys(own[key]).length ? "" : "  (defaults)");
      box.appendChild(row);
    }
  }

  function setLineTab(st, tab) {
    st.tab = tab;
    st.tabLineBtn.classList.toggle("active", tab === "line");
    st.tabProcBtn.classList.toggle("active", tab === "processes");
    st.tabEvBtn.classList.toggle("active", tab === "evidence");
    st.tabPipeBtn.classList.toggle("active", tab === "pipeline");
    for (const el of [st.plan, st.planDetails, st.graph, st.previewPanel, st.transcriptWrap, st.row]) {
      el.hidden = tab !== "line";
    }
    st.procPane.hidden = tab !== "processes";
    st.evPane.hidden = tab !== "evidence";
    st.pipePane.hidden = tab !== "pipeline";
    st.workPane.hidden = tab !== "work";
    st.tabWorkBtn.classList.toggle("active", tab === "work");
    if (tab === "work") {
      if (!st.work) st.work = registryLine.mount(document, st.workPane, { fetch: (u, o) => fetch(u, o), window, lineId: st.id });
      st.work.load();
    }
    if (tab === "pipeline") {
      st.pipeForm.open();
      reloadPresets();
    }
    if (tab === "processes") pollInventory();
    if (tab === "evidence") pollEvidence();
    if (tab === "line") {
      renderGraph(st);
      syncTranscriptScroll(st);
    }
  }

  const registryToggle = registryUI.createToggle(
    () => { document.getElementById("lines").hidden = true; },
    () => { document.getElementById("lines").hidden = false; },
    () => { regView.start(); registryEl.hidden = false; registryBtn.setAttribute("aria-pressed", "true"); },
    () => { regView.stop(); registryEl.hidden = true; registryBtn.setAttribute("aria-pressed", "false"); });
  const registryEl = document.getElementById("registry");
  const registryBtn = document.getElementById("registryBtn");
  const regView = registryUI.mount(document, registryEl, { fetch: (u) => fetch(u), window, EventSource: window.EventSource });
  registryBtn.addEventListener("click", () => registryToggle.toggle());

  function selectLine(id) {
    registryToggle.hide();
    selectedLine = id;
    for (const st of cards.values()) {
      const show = st.id === id;
      st.card.style.display = show ? "flex" : "none";
      st.entry.classList.toggle("selected", show);
    }
    document.getElementById("empty").hidden = id !== null;
    const st = cards.get(id);
    if (!st) return;
    if (st.tab === "processes") pollInventory();
    else {
      renderGraph(st);
      syncTranscriptScroll(st);
    }
  }

  function inventoryRow(lineId, item) {
    const row = document.createElement("div");
    row.className = "invRow";
    const kind = document.createElement("span");
    kind.className = "kind";
    kind.textContent = item.kind === "container" ? "ctr" : "proc";
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = item.name + (item.status === "running" ? "" : "  (" + item.status + ")");
    nm.style.color = item.status === "running" ? "#d8dee6" : "#4a5563";
    const by = document.createElement("span");
    by.className = "by";
    by.textContent = "by: " + (item.by === "planner" ? "planner"
      : String(item.by).slice(0, 8));
    const keep = document.createElement("button");
    keep.className = "keepBtn" + (item.keep ? " kept" : "");
    keep.textContent = item.keep ? "kept" : "keep";
    keep.title = "Keep: survives stage end and line deletion until killed";
    keep.addEventListener("click", async () => {
      await fetch("/api/lines/" + lineId + "/inventory/" + item.id + "/keep", {
        method: "POST", headers: { "Content-Type": "application/json" },

      pollInventory();

  function renderLineProcesses(st, items) {
    const pane = st.procPane;
    pane.innerHTML = "";
    const head = document.createElement("div");
    head.className = "pHead";
    const sub = document.createElement("span");
    sub.className = "sub";
    const running = items.filter((i) => i.status === "running").length;
    sub.textContent = items.length + " items, " + running + " running";
    const killAll = document.createElement("button");
    killAll.className = "killBtn";
    killAll.style.marginLeft = "auto";
    killAll.textContent = "Kill all";
    killAll.addEventListener("click", async () => {
      await fetch("/api/lines/" + st.id + "/inventory/kill-all", { method: "POST" });
      pollInventory();
    });
    head.append(sub, killAll);
    pane.appendChild(head);
    if (!items.length) {
      const e = document.createElement("div");
      e.className = "pEmpty";
      e.textContent = "No processes or containers started.";
      pane.appendChild(e);

    for (const item of items) pane.appendChild(inventoryRow(st.id, item));

  function renderEvidence(st, response) {
    return renderEvidenceFromState(st, response);
  }

  async function pollEvidence() {
    const st = cards.get(selectedLine);
    if (!st || st.tab !== "evidence") return;
    const gen = (st.evidenceGen = (st.evidenceGen || 0) + 1);
    const lineId = st.id;
    try {
      const res = await fetch("/api/lines/" + lineId + "/evidence");
      if (!res.ok || !evidencePollIsCurrent(st, lineId, gen, selectedLine, cards.get(lineId))) return;
      const response = await res.json();
      if (!evidencePollIsCurrent(st, lineId, gen, selectedLine, cards.get(lineId))) return;
      st.evidenceResponse = response;
      renderEvidence(st, response);
    } catch {}
  }

  async function pollInventory() {
    const st = cards.get(selectedLine);
    if (!st || st.tab !== "processes") return;
    const gen = (st.invGen = (st.invGen || 0) + 1);
    try {
      const res = await fetch("/api/lines/" + st.id + "/inventory");
      if (!res.ok) return;
      const { items } = await res.json();
      if (gen !== st.invGen || st.tab !== "processes" || selectedLine !== st.id) return;
      renderLineProcesses(st, items);
    } catch {}
  }

  async function pollPlans() {
    for (const st of cards.values()) {
      try {
        const res = await fetch("/api/lines/" + st.id + "/plan");
        const data = await res.json();
        if (data.approved !== st.approved) {
          st.approved = data.approved;
          updateControls(st);
        }
        const content = data.exists ? data.content : null;
        if (content !== st.planContent) {
          st.planContent = content;
          st.waiting.hidden = content !== null;
          updateControls(st);
          st.planBody.innerHTML = "";
          if (content !== null) renderPlan(st, content);
        }
      } catch {}
    }
  }

  async function refresh() {
    try {
      const res = await fetch("/api/lines");
      const { lines } = await res.json();
      const present = new Set(lines.map((l) => l.id));
      for (const id of [...cards.keys()]) {
        if (!present.has(id)) removeCard(id);
      }
      for (const line of lines) {
        if (!cards.has(line.id)) { addCard(line); continue; }
        const st = cards.get(line.id);
        if (line.started && !st.started) {
          st.started = true;
          st.input.placeholder = "Send a prompt";
        }
        if (st.entryCount) st.entryCount.textContent = line.workers ? line.workers + "w" : "";
      }
    } catch {}
  }

  // --- creation panel ---
  const createBtn = document.getElementById("create");
  const linesMain = document.getElementById("lines");
  const createPanel = document.createElement("div");
  createPanel.id = "createPanel";
  createPanel.hidden = true;
  const cpTitle = document.createElement("h2");
  cpTitle.textContent = "Create a production line";
  createPanel.appendChild(cpTitle);

  const mkLabel = (text, inputEl) => {
    const l = document.createElement("label");
    l.textContent = text;
    l.htmlFor = inputEl.id;
    return l;
  };

  const nameInput = document.createElement("input");
  nameInput.id = "cp-name";
  nameInput.placeholder = "optional";
  createPanel.append(mkLabel("Name", nameInput), nameInput);

  const repoInput = document.createElement("input");
  repoInput.id = "cp-repo";
  repoInput.placeholder = "optional";
  repoInput.type = "url";
  createPanel.append(mkLabel("Repo URL", repoInput), repoInput);

  // Installed harnesses, shared by every pipeline form. A form asks for a
  // reload when it opens; concurrent reloads share one request.
  let installedHarnesses = [];
  let harnessMissingText = "";
  let harnessRequest = null;
  const harnessListeners = new Set();
  function reloadHarnesses() {
    if (harnessRequest) return harnessRequest;
    harnessRequest = (async () => {
      try {
        const res = await fetch("/api/harnesses");
        if (!res.ok) return;
        const data = await res.json();
        installedHarnesses = filterInstalled(data.harnesses);
        const missing = installedHarnesses.filter((h) => h.auth === "missing");
        harnessMissingText = missing.length
          ? "Login needed: " + missing.map((h) =>
              h.id + " (" + (h.loginHint || h.id + " login") + ")").join(", ")
          : "";
        for (const listener of harnessListeners) listener();
      } catch {} finally { harnessRequest = null; }
    })();
    return harnessRequest;
  }

  // Rebuild the options of a select, keeping its default "" option and its
  // current value when that value still exists.
  function setSelectOptions(sel, options) {
    const current = sel.value;
    for (const o of [...sel.options]) if (o.value !== "") o.remove();
    for (const opt of options) {
      const o = document.createElement("option");
      o.value = opt.value;
      o.textContent = opt.label;
      sel.appendChild(o);
    }
    sel.value = [...sel.options].some((o) => o.value === current) ? current : "";
  }

  // Select a value, adding it as an option first when the current choices
  // do not list it (a saved model the metadata does not know, or a harness
  // that is not installed here).
  function selectValue(sel, value, missingLabel) {
    const v = typeof value === "string" ? value : "";
    if (v && ![...sel.options].some((o) => o.value === v)) {
      const o = document.createElement("option");
      o.value = v;
      o.textContent = v + (missingLabel ? " (" + missingLabel + ")" : "");
      sel.appendChild(o);
    }
    sel.value = v;
  }

  // One pipeline settings form: a row per phase with harness, Pi auth mode,
  // model, effort, and (for resumed phases) max context. Used by the create
  // panel and by each line's Pipeline page. read() returns { pipeline } or
  // { error }; set() fills the form from a pipeline override object.
  function createPipelineForm(idPrefix) {
    const el = document.createElement("div");
    el.className = "pipeForm";
    const harnessSelects = {}, authModeSelects = {}, modelSelects = {},
      effortSelects = {}, authHints = {}, maxContextInputs = {};
    const phaseState = {};
    // Fields the form has no control for (timeLimit) survive a set/read.
    let extraFields = {};
    for (const { key } of PHASE_ROWS) {
      const row = document.createElement("div");
      row.className = "phaseRow";
      const phaseName = document.createElement("span");
      phaseName.className = "phaseName";
      phaseName.textContent = key;
      const mkSelect = (kind, label) => {
        const sel = document.createElement("select");
        sel.id = idPrefix + "-" + kind + "-" + key;
        sel.setAttribute("aria-label", key + " " + label);
        const def = document.createElement("option");
        def.value = "";
        def.textContent = "default";
        sel.appendChild(def);
        return sel;
      };
      const hSel = mkSelect("harness", "harness");
      const amSel = mkSelect("authmode", "authentication mode");
      amSel.hidden = true;
      amSel.disabled = true;
      const mSel = mkSelect("model", "model");
      const eSel = mkSelect("effort", "effort");
      for (const level of EFFORT_LEVELS) {
        const o = document.createElement("option");
        o.value = level;
        o.textContent = level;
        eSel.appendChild(o);
      }
      const hint = document.createElement("div");
      hint.className = "authHint";
      row.append(phaseName, hSel, amSel, mSel, eSel);
      if (CONTEXT_PHASES.includes(key)) {
        const ctxIn = document.createElement("input");
        ctxIn.id = idPrefix + "-maxctx-" + key;
        ctxIn.placeholder = "max ctx";
        ctxIn.title = "Max context window, e.g. 200K or 50K. The session is compacted when it reaches this size. Empty uses the router default.";
        ctxIn.setAttribute("aria-label", key + " max context window");
        row.appendChild(ctxIn);
        maxContextInputs[key] = ctxIn;
      }
      row.appendChild(hint);
      el.appendChild(row);
      harnessSelects[key] = hSel;
      authModeSelects[key] = amSel;
      modelSelects[key] = mSel;
      effortSelects[key] = eSel;
      authHints[key] = hint;
      phaseState[key] = clearHarnessState(null);
    }
    const authSummary = document.createElement("div");
    authSummary.className = "authSummary";
    el.appendChild(authSummary);

    function syncPhaseRow(key) {
      const state = phaseState[key];
      const harness = harnessSelects[key].value;
      const amSel = authModeSelects[key];
      // The pure state resets the value to "" for every non-Pi harness, so a
      // stale selected mode cannot survive a harness change.
      const amState = authModeSelectState({
        harnessId: harness,
        options: harness === PI_HARNESS_ID
          ? authModeOptions(installedHarnesses, PI_HARNESS_ID)
          : [],
        currentValue: amSel.value,
      });
      setSelectOptions(amSel, amState.options);
      amSel.value = amState.value;
      amSel.hidden = amState.hidden;
      amSel.disabled = amState.disabled;
      setSelectOptions(modelSelects[key], state.models);
      authHints[key].textContent = state.statusText || baseAuthHintText(key);
    }

    function baseAuthHintText(key) {
      const id = harnessSelects[key].value;
      const entry = installedHarnesses.find((h) => h.id === id);
      if (!entry) return "";
      const badge = authBadge(entry);
      if (badge === "missing")
        return entry.id + ": auth missing - run " + (entry.loginHint || entry.id + " login");
      // vibe and pi have no provider-free auth probe, so their base state is
      // honestly "not probed"; pi shows the real state after a mode is chosen.
      if (badge === "unknown") return entry.id + ": installed (auth not probed)";
      return entry.id + ": " + badge;
    }

    function updateAuthHint(key) {
      authHints[key].textContent = phaseState[key].statusText || baseAuthHintText(key);
    }

    for (const { key } of PHASE_ROWS) {
      harnessSelects[key].addEventListener("change", () => onHarnessChange(key));
      authModeSelects[key].addEventListener("change", () => onAuthModeChange(key));
    }

    function onHarnessChange(key) {
      // New harness: drop the auth mode, model, models, status, and hints, and
      // invalidate any in-flight Pi detail fetch for this row.
      const state = phaseState[key];
      state.tracker.next();
      const next = clearHarnessState(state);
      next.models = modelOptionsForPhase({
        harnesses: installedHarnesses,
        harnessId: harnessSelects[key].value,
        piDetail: null,
      });
      // Explicitly reset the auth mode select before it is hidden or filled.
      authModeSelects[key].value = "";
      phaseState[key] = next;
      syncPhaseRow(key);
    }

    async function onAuthModeChange(key) {
      const state = phaseState[key];
      const provider = authModeSelects[key].value;
      // New mode: drop provider-specific state and invalidate older fetches.
      state.tracker.next();
      phaseState[key] = clearProviderState(state);
      syncPhaseRow(key);
      if (!provider) return;
      const token = phaseState[key].tracker.next();
      const result = await fetchPiDetail({
        url: piDetailUrl(provider),
        fetchImpl: fetch,
        isCurrent: (t) => phaseState[key].tracker.isCurrent(t),
        token,
      });
      if (result.stage === "fetch-error") {
        if (result.current) {
          phaseState[key].statusText = result.error;
          updateAuthHint(key);
        }
        return;
      }
      // fetchPiDetail already dropped a response that went stale when the
      // fetch resolved, before the status was read or the body parsed.
      if (result.stage === "stale-after-fetch") return;
      // Recheck after the async json() step: a newer selection must win.
      const outcome = piDetailApply({
        isCurrent: result.current,
        ok: result.ok,
        status: result.status,
        data: result.data,
      });
      if (!outcome.apply) return;
      phaseState[key].piDetail = outcome.piDetail;
      phaseState[key].models = outcome.models;
      phaseState[key].statusText = outcome.statusText;
      syncPhaseRow(key);
    }

    // Base metadata arrived: refresh harness options, auth mode options and
    // model choices (Vibe and Claude rows pick up their models here; Pi rows
    // wait for a mode).
    function applyHarnesses() {
      for (const { key } of PHASE_ROWS) {
        const sel = harnessSelects[key];
        const current = sel.value;
        const model = modelSelects[key].value;
        for (const o of [...sel.options]) if (o.value !== "") o.remove();
        for (const h of installedHarnesses) {
          const o = document.createElement("option");
          o.value = h.id;
          o.textContent = h.id + (h.version ? " (" + h.version + ")" : "");
          sel.appendChild(o);
        }
        selectValue(sel, current, "not installed");
        if (sel.value !== PI_HARNESS_ID) {
          phaseState[key].models = modelOptionsForPhase({
            harnesses: installedHarnesses,
            harnessId: sel.value,
            piDetail: null,
          });
        }
        syncPhaseRow(key);
        selectValue(modelSelects[key], model);
      }
      authSummary.textContent = harnessMissingText;
    }
    harnessListeners.add(applyHarnesses);

    function set(pipeline) {
      const p = pipeline && typeof pipeline === "object" ? pipeline : {};
      extraFields = {};
      for (const { key } of PHASE_ROWS) {
        const cfg = p[key] && typeof p[key] === "object" ? p[key] : {};
        selectValue(harnessSelects[key], cfg.harness, "not installed");
        onHarnessChange(key);
        selectValue(modelSelects[key], cfg.model);
        effortSelects[key].value = EFFORT_LEVELS.includes(cfg.effort) ? cfg.effort : "";
        if (maxContextInputs[key]) {
          maxContextInputs[key].value = cfg.maxContext ? formatTokens(cfg.maxContext) : "";
        }
        if (cfg.timeLimit) extraFields[key] = { timeLimit: cfg.timeLimit };
      }
    }

    function read() {
      const rows = {};
      for (const { key } of PHASE_ROWS) {
        rows[key] = {
          ...(extraFields[key] || {}),
          harness: harnessSelects[key].value,
          model: modelSelects[key].value,
          effort: effortSelects[key].value,
        };
        if (maxContextInputs[key]) {
          const maxContext = parseContextSize(maxContextInputs[key].value);
          if (Number.isNaN(maxContext)) {
            return { error: key + " max context must look like 200K, 50K or 1M" };
          }
          rows[key].maxContext = maxContext;
        }
      }
      return { pipeline: buildPipelinePayload(rows) };
    }

    return { el, set, read, reset: () => set(null),
      open: () => { applyHarnesses(); reloadHarnesses(); },
      dispose: () => harnessListeners.delete(applyHarnesses) };
  }

  // Preset bar for a pipeline form: pick a saved preset to fill the form,
  // save the form as a named preset, or delete the selected preset. Every
  // bar on the page shares the server-side preset list.
  const presetBars = new Set();
  let presetList = [];
  async function reloadPresets() {
    try {
      const res = await fetch("/api/pipeline-presets");
      if (!res.ok) return;
      presetList = (await res.json()).presets || [];
      for (const bar of presetBars) bar.render();
    } catch {}
  }

  function createPresetBar(form, showError) {
    const el = document.createElement("div");
    el.className = "presetBar";
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", "pipeline preset");
    const nameIn = document.createElement("input");
    nameIn.placeholder = "preset name";
    nameIn.setAttribute("aria-label", "preset name");
    const saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.textContent = "Save as preset";
    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "secondary";
    delBtn.textContent = "Delete preset";
    el.append(sel, nameIn, saveBtn, delBtn);

    function render() {
      const current = sel.value;
      sel.innerHTML = "";
      const none = document.createElement("option");
      none.value = "";
      none.textContent = presetList.length ? "Load a preset…" : "No presets saved";
      sel.appendChild(none);
      for (const p of presetList) {
        const o = document.createElement("option");
        o.value = p.name;
        o.textContent = p.name;
        sel.appendChild(o);
      }
      sel.value = presetList.some((p) => p.name === current) ? current : "";
      delBtn.disabled = !sel.value;
    }

    sel.addEventListener("change", () => {
      const preset = presetList.find((p) => p.name === sel.value);
      delBtn.disabled = !preset;
      if (!preset) return;
      form.set(preset.pipeline);
      nameIn.value = preset.name;
      showError(null);
    });
    saveBtn.addEventListener("click", async () => {
      const name = nameIn.value.trim();
      if (!name) return showError("Type a preset name first.");
      const out = form.read();
      if (out.error) return showError(out.error);
      if (!out.pipeline) return showError("Choose at least one setting before saving a preset.");
      const res = await fetch("/api/pipeline-presets/" + encodeURIComponent(name), {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pipeline: out.pipeline }),
      }).catch(() => null);
      if (!res || !res.ok) {
        const data = res ? await res.json().catch(() => ({})) : {};
        return showError(data.error || "Saving the preset failed.");
      }
      showError(null);
      await reloadPresets();
      sel.value = name;
      delBtn.disabled = false;
    });
    delBtn.addEventListener("click", async () => {
      if (!sel.value) return;
      await fetch("/api/pipeline-presets/" + encodeURIComponent(sel.value), { method: "DELETE" })
        .catch(() => null);
      nameIn.value = "";
      await reloadPresets();
    });

    const bar = { el, render, reset: () => { sel.value = ""; nameIn.value = ""; render(); },
      dispose: () => presetBars.delete(bar) };
    presetBars.add(bar);
    render();
    return bar;
  }

  const createErr = document.createElement("div");
  createErr.className = "createErr";
  createErr.hidden = true;
  const showCreateError = (message) => {
    createErr.textContent = message || "";
    createErr.hidden = !message;
  };
  const createForm = createPipelineForm("cp");
  const createPresets = createPresetBar(createForm, showCreateError);
  const pipeLabel = document.createElement("label");
  pipeLabel.textContent = "Pipeline";
  createPanel.append(pipeLabel, createPresets.el, createForm.el);

  const cpBtns = document.createElement("div");
  cpBtns.className = "row";
  cpBtns.style.borderTop = "0";
  cpBtns.style.padding = "10px 0 0";
  const cpCreate = document.createElement("button");
  cpCreate.textContent = "Create line";
  const cpCancel = document.createElement("button");
  cpCancel.textContent = "Cancel";
  cpCancel.style.background = "#262b33";
  cpBtns.append(cpCreate, cpCancel);
  createPanel.append(createErr, cpBtns);
  linesMain.insertBefore(createPanel, linesMain.firstChild);

  function resetCreatePanel() {
    nameInput.value = "";
    repoInput.value = "";
    createForm.reset();
    createPresets.reset();
    showCreateError(null);
  }

  createBtn.addEventListener("click", () => {
    createPanel.hidden = !createPanel.hidden;
    if (!createPanel.hidden) {
      createForm.open();
      reloadPresets();
      nameInput.focus();
    }
  });

  cpCancel.addEventListener("click", () => {
    createPanel.hidden = true;
    resetCreatePanel();
  });

  cpCreate.addEventListener("click", async () => {
    const body = {};
    const name = nameInput.value.trim();
    const repoUrl = repoInput.value.trim();
    if (name) body.name = name;
    if (repoUrl) body.repoUrl = repoUrl;
    const out = createForm.read();
    if (out.error) return showCreateError(out.error);
    if (out.pipeline) body.pipeline = out.pipeline;
    showCreateError(null);
    let res;
    try {
      res = await fetch("/api/lines", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    } catch (err) {
      showCreateError(String(err));
      return;
    }
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showCreateError(data.error || "Creation failed (HTTP " + res.status + ")");
      return;
    }
    const { id } = await res.json().catch(() => ({}));
    createPanel.hidden = true;
    resetCreatePanel();
    await refresh();
    if (id) selectLine(id);
  });

  const dashboardStream = new EventSource("/api/events");
  dashboardStream.addEventListener("dashboard", (e) => {
    let envelope;
    try { envelope = JSON.parse(e.data); } catch { return; }
    if (!envelope || envelope.version !== 1) return;
    if (envelope.type === "snapshot_begin") {
      const present = new Set((envelope.data.lines || []).map((line) => line.id));
      for (const id of [...cards.keys()]) if (!present.has(id)) removeCard(id);
      for (const line of envelope.data.lines || []) if (!cards.has(line.id)) addCard(line);
      return;
    }
    if (envelope.type === "line_created") {
      if (!cards.has(envelope.lineId)) addCard(envelope.data);
      return;
    }
    if (envelope.type === "line_deleted") {
      removeCard(envelope.lineId || envelope.data.id);
      return;
    }
    const st = cards.get(envelope.lineId);
    const handler = st && st.handlers && st.handlers[envelope.type];
    if (handler) handler(envelope.data);
  });
  dashboardStream.addEventListener("error", () => {
    // EventSource reconnects automatically; do not present a transport failure as a line error.
  });
  refresh();
  setInterval(pollPlans, 3000);
  setInterval(pollInventory, 3000);
  setInterval(pollEvidence, 3000);
});
</script>
</body>
</html>
