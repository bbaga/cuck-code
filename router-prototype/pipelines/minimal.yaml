# The order of the nodes comes from the edges, the checks and the requires of the
# integration type. The keys after and the script check nodes are optional.
# See the README section "Script check nodes".
name: minimal
description: One planner, one implementor, one validator and an integration validator.
start: planner

nodes:
  planner:     { type: planner }
  impl:        { type: backend-implementor }
  val:         { type: backend-validator, checks: [impl] }
  integration: { type: integration-validator }

edges:
  - planner -> impl: start, feedback, accept
  - impl -> planner: report
  - planner -> val: start
  - val -> planner: report
  - planner -> integration: start
  - integration -> planner: report
